name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: pip install pytest redis

      - name: Run unit tests (no IBKR / Nautilus)
        run: |
          python scripts/verify_scope.py
          pytest scripts/test_risk_gate.py \
                 scripts/test_order_policy.py \
                 scripts/test_signal_store.py \
                 -q
          python scripts/test_trading_env.py

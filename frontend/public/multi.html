            });

            state[symbol] = {
                symbol, chart, candleSeries,
                stSeriesList: [], stLastDir: null, stLastSeries: null,
                stM5SeriesList: [], stM5LastDir: null, stM5LastSeries: null,
                dema20M5Series: null, vwapM1Series: null, m5Frozen: null, m5Bars: [],
                orderMarkers: [], signalMarkers: [],
                st1: null, st5: null, st5Dir: 0, prev1mDir: null, m1Frozen: null, superSide: 0,
                lastM1Time: 0,
                autoMode: 'off',
            };
        }

        const ST_COLOR_BULL = '#26a69a';
        const ST_COLOR_BEAR = '#ef5350';
        const ST_LINE_M1 = 2;
        const ST_LINE_M5 = 4;
        const DEMA20_M5_COLOR = '#b388ff';
        const VWAP_M1_COLOR = '#f59e0b';

        const IND_LABELS = {
            ST_M1: 'ST 1m',
            ST_M5: 'ST 5m',
            DEMA20_M5: 'DEMA20 M5',
            VWAP_M1: 'VWAP M1',
        };

        // ══════════════════════════════════════════════════════════
        //  MTF SuperTrend 信号（前端重算，参数：1m=(10,3.0) 5m=(10,3.5)）
        //  与 strategy._STState 转向逻辑一致（Wilder ATR + 上一根 band 判断）
        // ══════════════════════════════════════════════════════════
        const ST_PERIOD = 10, ST_MULT_1M = 3.0, ST_MULT_5M = 3.5;
        const SIG_ENTRY_START = 9 * 60 + 45;   // 09:45（与 RiskGate 一致）
        const SIG_ENTRY_END = 16 * 60 - 30;    // 15:30

        class WilderATR {
            constructor(period) { this.period = period; this._trs = []; this.value = 0; this._prevClose = 0; this._has = false; }
            update(h, lo, c) {
                let tr;
                if (!this._has) tr = h - lo;
                else tr = Math.max(h - lo, Math.abs(h - this._prevClose), Math.abs(lo - this._prevClose));
                this._has = true;
                this._trs.push(tr);
                this._prevClose = c;
                if (this._trs.length < this.period) return null;
                if (this._trs.length === this.period) this.value = this._trs.reduce((a, b) => a + b, 0) / this.period;
                else this.value = (this.value * (this.period - 1) + tr) / this.period;
                return this.value;
            }
        }

        class JsST {
            constructor(period, mult) {
                this.period = period; this.mult = mult; this.atr = new WilderATR(period);
                this._prevClose = 0; this._prevU = 0; this._prevL = 0; this._prevDir = -1; this._init = false;
            }
            get initialized() { return this._init; }
            update(o, h, lo, c) {
                const atr = this.atr.update(h, lo, c);
                if (atr == null) { this._prevClose = c; return [0, 1]; }
                const hl2 = (h + lo) / 2, bu = hl2 + this.mult * atr, bl = hl2 - this.mult * atr;
                const fU = this._prevU, fL = this._prevL;
                let U, L;
                if (!this._init) { U = bu; L = bl; this._init = true; }
                else {
                    U = (bu < this._prevU || this._prevClose > this._prevU) ? bu : this._prevU;
                    L = (bl > this._prevL || this._prevClose < this._prevL) ? bl : this._prevL;
                }
                let dir;
                if (this._prevDir === -1 && c > fU) dir = 1;
                else if (this._prevDir === 1 && c < fL) dir = -1;
                else dir = this._prevDir;
                const val = dir === 1 ? L : U;
                this._prevClose = c; this._prevU = U; this._prevL = L; this._prevDir = dir;
                return [Math.round(val * 10000) / 10000, dir];
            }
        }

        // 用指定参数把 OHLC 序列重算成 [{time, close, st_value, st_dir}]，返回 {out, st}
        function computeSTSeries(bars, period, mult) {
            const st = new JsST(period, mult);
            const out = [];
            for (const b of bars) {
                const [val, dir] = st.update(b.open, b.high, b.low, b.close);
                const ok = st.initialized && val > 0;
                out.push({ time: b.time, close: b.close, st_value: ok ? val : null, st_dir: ok ? dir : null });
            }
            return { out, st };
        }

        // 把 1m ST 采样到 5m 时间点（每桶取最后一根），避免 1m 线插入 5m 图产生空档
        function resample1mSTto5m(m1ST) {
            const byB = new Map();
            for (const p of m1ST) {
                if (p.st_value != null) byB.set(bucket5m(p.time), { st_value: p.st_value, st_dir: p.st_dir });
            }
            return [...byB.entries()].sort((a, b) => a[0] - b[0])
                .map(([time, v]) => ({ time, st_value: v.st_value, st_dir: v.st_dir }));
        }

        // 最近一根已收盘 5m bar 的方向（无前视：桶 time+300 须 <= 当前 1m 时间）
        function dir5AtCompleted(m5ST, t) {
            let d = 0;
            for (const b of m5ST) {
                if (b.time + 300 <= t) { if (b.st_dir != null) d = b.st_dir; }
                else break;
            }
            return d;
        }

        // 信号检测：M5 桶收盘节奏 — 1m ST 翻转且与 5m ST 同向
        function detectSignals(m1ST, m5ST) {
            const sigs = []; let prev = null;
            const ends = new Map();
            for (const p of m1ST) {
                if (p.st_dir == null || p.st_value == null || p.st_value === 0) continue;
                ends.set(bucket5m(p.time), p);
            }
            for (const p of [...ends.values()].sort((a, b) => a.time - b.time)) {
                const em = (p.time % 86400) / 60;
                if (prev != null && p.st_dir !== prev) {
                    const d5 = dir5AtCompleted(m5ST, p.time);
                    if (d5 !== 0 && d5 === p.st_dir && em >= SIG_ENTRY_START && em < SIG_ENTRY_END) {
                        sigs.push({ time: bucket5m(p.time), side: p.st_dir, entry: p.close, stop: p.st_value });
                    }
                }
                prev = p.st_dir;
            }
            return sigs;
        }

        function signalMarker(side) {
            const isLong = side === 1;
            return {
                position: isLong ? 'belowBar' : 'aboveBar',
                color: isLong ? ST_COLOR_BULL : ST_COLOR_BEAR,
                shape: isLong ? 'arrowUp' : 'arrowDown',
                text: isLong ? '▲超级' : '▼超级',
                size: 1.4,
            };
        }

        function setSignalPill(sym, side) {
            if (state[sym]) state[sym].superSide = side;
            updateAlphaPill(sym);
            updateAlphaSidePanels(sym);
        }

        // 1m ST 线实时续接（按方向分段，细线）
        function updateM1STForSymbol(sym, t, val, dir) {
            const s = state[sym];
            if (val == null || val === 0 || dir == null) return;
            if (dir !== s.stLastDir || !s.stLastSeries) {
                const color = dir === 1 ? ST_COLOR_BULL : ST_COLOR_BEAR;
                s.stLastSeries = s.chart.addLineSeries({
                    color, lineWidth: ST_LINE_M1,
                    crosshairMarkerVisible: false, lastValueVisible: false, priceLineVisible: false,
                });
                s.stSeriesList.push(s.stLastSeries);
                s.stLastDir = dir;
                refreshSegmentLabels(s.stSeriesList, IND_LABELS.ST_M1);
            }
            s.stLastSeries.update({ time: t, value: val });
        }

        // 新增一个超级信号标记（实时）
        function addSignalMarker(sym, t, side, entry, stop, { backend = false } = {}) {
            const s = state[sym];
            if (!s.signalMarkers) s.signalMarkers = [];
            const mk = signalMarker(side);
            if (s.signalMarkers.some(m => m.time === t && m.text === mk.text)) return;
            s.signalMarkers.push({ time: t, ...mk });
            refreshMarkers(sym);
            setSignalPill(sym, side);
            if (backend) {
                showToast(`${mk.text} ${sym}`, 'warn');
            }
        }

        function applyBackendTouch(touch, { announce = false, autoShow = false } = {}) {
            if (!touch || touch.signal_type !== 'st_super') return;
            const sym = String(touch.symbol || '').toUpperCase();
            const side = touch.side === 'SHORT' ? -1 : 1;
            const t = touch.touch_time || touch.m1_bar_time;
            const stop = Number(touch.trigger_level || touch.stop_price || 0);
            if (!t) return;

            const dedupeKey = `${sym}:${t}`;
            if (announce && _lastSignalAnnounce[dedupeKey]) return;
            if (announce) _lastSignalAnnounce[dedupeKey] = Date.now();

            if (autoShow && !DEFAULT_SYMBOLS.includes(sym)) {
                if (window.AlphaWorkflow) {
                    AlphaWorkflow.handleSignal(touch, { deferGrid: true });
                }
                autoAssignSymbolToGrid(sym, 'signal', { signal: touch });
                return;
            }
            if (!state[sym]) return;

            state[sym].lastSignalAt = Date.now();
            state[sym].superSide = side;
            addSignalMarker(sym, t, side, touch.m1_close, stop, { backend: false });
            state[sym].lastSuperTouch = touch;
            updateAlphaPill(sym);
            updateAlphaSidePanels(sym);
            if (announce) {
                if (window.AlphaWorkflow) {
                    AlphaWorkflow.handleSignal(touch);
                } else {
                    const sd = side === 1 ? '多' : '空';
                    speak(`${sym} 超级${sd}`, true);
                    showToast(`⚡ ${sym} 超级${sd} 止损${stop.toFixed(2)}`, 'warn');
                    focusCell(sym);
                }
            }
        }

        function refreshSegmentLabels(seriesList, label) {
            seriesList.forEach((s, i) => {
                const active = i === seriesList.length - 1;
                s.applyOptions({
                    title: active ? label : '',
                    lastValueVisible: active,
                });
            });
        }

        /** M5 指标铺到 M1：桶收盘（下一档 M1 开始）后才切换，避免 ST 转向提前 5 分钟 */
        function expandM5OntoM1(m1Bars, m5Bars) {
            if (!m1Bars?.length || !m5Bars?.length) return [];
            const BUCKET_SEC = 300;
            const out = [];
            let j = 0;
            for (const m1 of m1Bars) {
                while (j + 1 < m5Bars.length && m5Bars[j + 1].time + BUCKET_SEC <= m1.time) j++;
                const m5 = m5Bars[j];
                if (!m5) continue;
                const src = (m1.time < m5.time + BUCKET_SEC && j > 0) ? m5Bars[j - 1] : m5;
                if (m1.time < src.time + BUCKET_SEC && j === 0) continue;
                out.push({
                    time: m1.time,
                    st_value: src.st_value,
                    st_dir: src.st_dir,
                    dema20: src.dema20,
                });
            }
            return out;
        }

        function updateM5IndicatorsForSymbol(sym, m1Time) {
            const s = state[sym];
            if (!s?.m5Frozen) return;
            const { st_value, st_dir, dema20 } = s.m5Frozen;
            if (st_value != null && st_value !== 0 && st_dir != null) {
                if (st_dir !== s.stM5LastDir || !s.stM5LastSeries) {
                    const color = st_dir === 1 ? ST_COLOR_BULL : ST_COLOR_BEAR;
                    s.stM5LastSeries = s.chart.addLineSeries({
                        color, lineWidth: ST_LINE_M5,
                        crosshairMarkerVisible: false, lastValueVisible: false, priceLineVisible: false,
                    });
                    s.stM5SeriesList.push(s.stM5LastSeries);
                    s.stM5LastDir = st_dir;
                    refreshSegmentLabels(s.stM5SeriesList, IND_LABELS.ST_M5);
                }
                s.stM5LastSeries.update({ time: m1Time, value: st_value });
            }
            if (dema20 != null && s.dema20M5Series) {
                s.dema20M5Series.update({ time: m1Time, value: dema20 });
            }
        }

        // ── SuperTrend 分段绘制（M1 细 / M5 粗）────────────────
        function createSegmentedST(symbol, bars, {
            lineWidth = ST_LINE_M1,
            listKey = 'st',
            labelTitle = null,
        } = {}) {
            const title = labelTitle ?? (listKey === 'm5' ? IND_LABELS.ST_M5 : IND_LABELS.ST_M1);
            const s = state[symbol];
            const listName = listKey === 'm5' ? 'stM5SeriesList' : 'stSeriesList';
            const dirName = listKey === 'm5' ? 'stM5LastDir' : 'stLastDir';
            const seriesName = listKey === 'm5' ? 'stM5LastSeries' : 'stLastSeries';
            s[listName].forEach(ser => s.chart.removeSeries(ser));
            s[listName] = [];
            s[dirName] = null;
            s[seriesName] = null;
            let currentDir = null, segData = [];

            function flush() {
                if (!segData.length) return;
                const color = currentDir === 1 ? ST_COLOR_BULL : ST_COLOR_BEAR;
                const ser = s.chart.addLineSeries({
                    color, lineWidth,
                    crosshairMarkerVisible: false, lastValueVisible: false, priceLineVisible: false,
                });
                ser.setData(segData);
                s[listName].push(ser);
                s[seriesName] = ser;
                s[dirName] = currentDir;
            }

            for (const bar of bars) {
                if (bar.st_value == null || bar.st_value === 0 || bar.st_dir == null) continue;
                if (bar.st_dir !== currentDir) { flush(); currentDir = bar.st_dir; segData = []; }
                segData.push({ time: bar.time, value: bar.st_value });
            }
            flush();
            refreshSegmentLabels(s[listName], title);
        }

        function mountM5Dema(symbol, points) {
            const s = state[symbol];
            if (s.dema20M5Series) {
                s.chart.removeSeries(s.dema20M5Series);
                s.dema20M5Series = null;
            }
            const data = points
                .filter(p => p.dema20 != null && !Number.isNaN(p.dema20))
                .map(p => ({ time: p.time, value: p.dema20 }));
            if (!data.length) return;
            s.dema20M5Series = s.chart.addLineSeries({
                color: DEMA20_M5_COLOR, lineWidth: 2,
                title: IND_LABELS.DEMA20_M5,
                crosshairMarkerVisible: false, lastValueVisible: true, priceLineVisible: false,
            });
            s.dema20M5Series.setData(data);
        }

        // 5 分钟桶起始时间戳（对齐 300 秒）
        function bucket5m(t) { return t - (t % 300); }

        // 将实时 tick / 1m 收盘刷进「正在形成的 1m K 线」并刷新蜡烛
        function feedForming1m(s, o, h, l, c, t) {
            if (!s?.candleSeries) return;
            let cur = s.curM1;
            if (!cur || cur.time !== t) {
                cur = { time: t, open: o, high: h, low: l, close: c };
                s.curM1 = cur;
            } else {
                cur.high = Math.max(cur.high, h);
                cur.low = Math.min(cur.low, l);
                cur.close = c;
            }
            s.candleSeries.update({ time: cur.time, open: cur.open, high: cur.high, low: cur.low, close: cur.close });
        }

        // VWAP 由 M1 重采样到 5m 时间点（避免 1m 线与 5m 蜡烛混用同一时间轴导致蜡烛稀疏）
        function mountVwap5m(symbol, m5Bars, m1Bars) {
            const s = state[symbol];
            if (s.vwapM1Series) {
                s.chart.removeSeries(s.vwapM1Series);
                s.vwapM1Series = null;
            }
            const byBucket = new Map();
            (m1Bars || []).forEach(b => {
                if (b.vwap != null && !Number.isNaN(b.vwap)) byBucket.set(bucket5m(b.time), b.vwap);
            });
            const data = (m5Bars || [])
                .map(b => ({ time: b.time, value: byBucket.get(b.time) }))
                .filter(p => p.value != null && !Number.isNaN(p.value));
            if (!data.length) return;
            s.vwapM1Series = s.chart.addLineSeries({
                color: VWAP_M1_COLOR, lineWidth: 2,
                lineStyle: LightweightCharts.LineStyle.Dashed,
                title: IND_LABELS.VWAP_M1,
                crosshairMarkerVisible: false, lastValueVisible: true, priceLineVisible: false,
            });
            s.vwapM1Series.setData(data);
        }

        // ── 开盘区间 OR High/Low ────────────────────────────────
        function addOpeningRange(symbol, bars) {
            const { candleSeries } = state[symbol];
            const or = bars.slice(0, 3);   // 开盘前 3 根 M5 = 前 15 分钟
            if (!or.length) return;
            const orH = Math.max(...or.map(b => b.high));
            const orL = Math.min(...or.map(b => b.low));
            [{ price: orH, title: `OR High ${orH.toFixed(2)}` },
            { price: orL, title: `OR Low  ${orL.toFixed(2)}` }].forEach(({ price, title }) => {
                candleSeries.createPriceLine({
                    price, color: '#f59e0b', lineWidth: 1,
                    lineStyle: LightweightCharts.LineStyle.Dashed,
                    axisLabelVisible: true, title,
                });
            });
        }

        // ── 仓位展示（兼容真实 IBKR 数据格式和旧 Redis 格式）──────────────
        // 真实 IBKR 字段：avg_px_open / unrealized_pnl / side / quantity / stop_loss
        // 旧 Redis 字段： entry_price / pnl / pnl_pct / quantity / entry_time / stop_loss
        function addPositionLines(symbol, position) {
            if (!position) return;
            const { candleSeries } = state[symbol];
            if (!candleSeries) return;

            const entryPrice = position.avg_px_open ?? position.entry_price;
            const stopLoss = position.stop_loss;
            const qty = position.quantity;
            const side = position.side || 'LONG';
            const isLong = side !== 'SHORT';
            const entryTime = position.entry_time;

            if (!entryPrice) return;

            const hasPos = Math.abs(qty || 0) > 0;
            if (state[symbol].entryPriceLine) {
                state[symbol].position = position;
                if (stopLoss) {
                    if (state[symbol].slPriceLine) {
                        state[symbol].slPriceLine.applyOptions({
                            price: stopLoss,
                            title: `止损 ${stopLoss}`,
                        });
                    } else {
                        state[symbol].slPriceLine = candleSeries.createPriceLine({
                            price: stopLoss, color: '#ef5350', lineWidth: 1,
                            lineStyle: LightweightCharts.LineStyle.Dashed,
                            axisLabelVisible: true, title: `止损 ${stopLoss}`,
                        });
                    }
                }
                refreshPositionPanel(symbol, position);
                refreshPosSidebar(symbol, position);
                updateCloseButton(symbol, hasPos);
                const cell = findCellForSymbol(symbol);
                if (cell) cell.classList.toggle('cell-has-position', hasPos);
                return;
            }

            // 保存仓位到 state，供行情变动时刷新浮盈
            state[symbol].position = position;

            // 开仓价线（蓝色虚线）
            state[symbol].entryPriceLine = candleSeries.createPriceLine({
                price: entryPrice, color: '#2196f3', lineWidth: 1,
                lineStyle: LightweightCharts.LineStyle.Dashed,
                axisLabelVisible: true,
                title: `开仓 ${typeof entryPrice === 'number' ? entryPrice.toFixed(2) : entryPrice}`,
            });

            // 止损价线（红色虚线，无止损时不画）
            if (stopLoss) {
                state[symbol].slPriceLine = candleSeries.createPriceLine({
                    price: stopLoss, color: '#ef5350', lineWidth: 1,
                    lineStyle: LightweightCharts.LineStyle.Dashed,
                    axisLabelVisible: true, title: `止损 ${stopLoss}`,
                });
                // 注意：不自动进入 modifyMode，等用户点击止损线标签
            }

            // 开仓 Marker（无 entry_time 时用最近 tick / M1 时间）
            const markerTime = entryTime || state[symbol].lastM1Time || state[symbol].lastTickTime;
            if (markerTime) {
                state[symbol].orderMarkers.push({
                    time: markerTime,
                    position: isLong ? 'belowBar' : 'aboveBar',
                    color: '#2196f3',
                    shape: isLong ? 'arrowUp' : 'arrowDown',
                    text: `${isLong ? 'BUY' : 'SELL'} @${entryPrice}`, size: 1,
                });
                refreshMarkers(symbol);
            }

            refreshPositionPanel(symbol, position);
            refreshPosSidebar(symbol, position);
            updateCloseButton(symbol, hasPos);
            const cell = findCellForSymbol(symbol);
            if (cell) cell.classList.add('cell-has-position');
        }

        function refreshPositionPanel(symbol, position) {
            if (!position) return;
            const entryPrice = position.avg_px_open ?? position.entry_price;
            const qty = position.quantity;
            const side = position.side || 'LONG';
            const isLong = side !== 'SHORT';

            let pnl = position.unrealized_pnl ?? position.pnl;
            let pnlPct = position.pnl_pct;

            // 真实数据实时重算浮盈%
            if (position.unrealized_pnl != null && entryPrice && qty > 0) {
                pnlPct = parseFloat((position.unrealized_pnl / (entryPrice * qty) * 100).toFixed(2));
            }

            const pnlEl = document.getElementById(`p-pnl-${symbol}`);
            const pnlPctEl = document.getElementById(`p-pnl-pct-${symbol}`);
            const fmt = v => typeof v === 'number' ? v.toFixed(2) : v;

            document.getElementById(`p-entry-${symbol}`).textContent = entryPrice ? fmt(entryPrice) : '—';
            document.getElementById(`p-sl-${symbol}`).textContent = position.stop_loss ?? '—';
            document.getElementById(`p-qty-${symbol}`).textContent = `${qty ?? '—'}股(${isLong ? '多' : '空'})`;

            if (pnl != null) {
                pnlEl.textContent = `${pnl >= 0 ? '+' : ''}${fmt(pnl)}`;
                pnlEl.className = pnl >= 0 ? 'up' : 'down';
            } else { pnlEl.textContent = '—'; pnlEl.className = ''; }

            if (pnlPct != null) {
                pnlPctEl.textContent = `(${pnlPct >= 0 ? '+' : ''}${fmt(pnlPct)}%)`;
                pnlPctEl.className = pnlPct >= 0 ? 'up' : 'down';
            } else { pnlPctEl.textContent = ''; }
            refreshPosSidebar(symbol, position);
        }

        // 清除图表价格线（开仓线 + 止损线）
        function clearChartLines(symbol) {
            const cs = state[symbol]?.candleSeries;
            if (!cs) return;
            if (state[symbol].entryPriceLine) {
                try { cs.removePriceLine(state[symbol].entryPriceLine); } catch (_) { }
                state[symbol].entryPriceLine = null;
            }
            if (state[symbol].slPriceLine) {
                try { cs.removePriceLine(state[symbol].slPriceLine); } catch (_) { }
                state[symbol].slPriceLine = null;
            }
            // 同时退出 modifyMode
            if (state[symbol]?.ctx) exitModifyMode(state[symbol].ctx);
        }

        function clearPositionUI(symbol) {
            state[symbol].position = null;
            clearChartLines(symbol);
            document.getElementById(`p-entry-${symbol}`).textContent = '—';
            document.getElementById(`p-sl-${symbol}`).textContent = '—';
            document.getElementById(`p-qty-${symbol}`).textContent = '—';
            document.getElementById(`p-pnl-${symbol}`).textContent = '—';
            document.getElementById(`p-pnl-pct-${symbol}`).textContent = '';
            refreshPosSidebar(symbol, null);
            updateCloseButton(symbol, false);
            const cell = findCellForSymbol(symbol);
            if (cell) cell.classList.remove('cell-has-position');
        }


        // ── 工具栏价格更新 ──────────────────────────────────────
        function updateHeader(symbol, bars) {
            if (!bars || bars.length < 2) return;
            const last = bars[bars.length - 1];
            const change = last.close - bars[0].open;
            const pct = (change / bars[0].open * 100).toFixed(2);
            const priceEl = document.getElementById(`price-${symbol}`);
            const changeEl = document.getElementById(`change-${symbol}`);
            priceEl.textContent = last.close.toFixed(2);
            changeEl.textContent = `${change >= 0 ? '+' : ''}${change.toFixed(2)} (${pct}%)`;
            const c = change >= 0 ? 'up' : 'down';
            priceEl.className = `c-price ${c}`;
            changeEl.className = `c-change ${c} ${c}-bg`;
        }

        // ── 加载单个标的数据 ────────────────────────────────────
        async function loadSymbol(symbol) {
            try {
                const res = await fetch(`/api/data/${symbol}`);
                if (!res.ok) throw new Error((await res.json()).error);
                const { m1_bars, m5_bars, position } = await res.json();

                document.getElementById(`loading-${symbol}`).style.display = 'none';

                // ── K 线：一分钟（主图 M1 蜡烛）──
                const m1 = m1_bars || [];
                const m5 = m5_bars || [];
                state[symbol].m5Bars = m5;
                state[symbol].candleSeries.setData(m1.map(b => ({
                    time: b.time, open: b.open, high: b.high, low: b.low, close: b.close,
                })));

                // ── ST 双线（均铺到 M1 时间轴）：1m 细（逐根）+ 5m 粗（阶梯化，桶收盘后切换）──
                const m1STForChart = m1.map(b => ({
                    time: b.time, close: b.close, st_value: b.st_value, st_dir: b.st_dir,
                }));
                const c1 = computeSTSeries(m1, ST_PERIOD, ST_MULT_1M);
                state[symbol].st1 = c1.st;
                const c5 = computeSTSeries(m5, ST_PERIOD, ST_MULT_5M);
                state[symbol].st5 = c5.st;

                createSegmentedST(symbol, expandM5OntoM1(m1, m5), { lineWidth: ST_LINE_M5, listKey: 'm5' });
                createSegmentedST(symbol, m1STForChart, { lineWidth: ST_LINE_M1, listKey: 'st', labelTitle: IND_LABELS.ST_M1 });

                // ── 超级信号标记：以后端 signals:touch 为准 ──
                try {
                    const touchRes = await fetch(`/api/signals/touches/${symbol}`).then(r => r.json());
                    const ss = (touchRes.touches || []).filter(t => t.signal_type === 'st_super');
                    state[symbol].signalMarkers = ss.map(t => ({
                        time: t.touch_time,
                        ...signalMarker(t.side === 'SHORT' ? -1 : 1),
                    }));
                    refreshMarkers(symbol);
                    const lastT = ss[ss.length - 1];
                    const lastSide = lastT ? (lastT.side === 'SHORT' ? -1 : 1) : 0;
                    state[symbol].lastSuperTouch = lastT || null;
                    state[symbol].superSide = lastSide;
                    setSignalPill(symbol, lastSide);
                } catch (_) {
                    state[symbol].signalMarkers = [];
                    state[symbol].lastSuperTouch = null;
                    setSignalPill(symbol, 0);
                }

                const lastM5 = m5[m5.length - 1];
                const lastM5ST = [...m5].reverse().find(b => b.st_value != null && b.st_dir != null);
                const lastM1Bar = m1[m1.length - 1];
                const lastM1ST = [...m1].reverse().find(b => b.st_value != null && b.st_dir != null);
                // 初始化正在形成的 1m 桶，供实时 tick 续接聚合
                state[symbol].curM1 = lastM1Bar
                    ? { time: lastM1Bar.time, open: lastM1Bar.open, high: lastM1Bar.high, low: lastM1Bar.low, close: lastM1Bar.close }
                    : null;
                if (lastM5) {
                    state[symbol].m5Frozen = {
                        st_value: lastM5ST ? lastM5ST.st_value : null,
                        st_dir: lastM5ST ? lastM5ST.st_dir : null,
                        dema20: lastM5.dema20,
                    };
                    state[symbol].stM5LastDir = lastM5ST ? lastM5ST.st_dir : null;
                    state[symbol].st5Dir = lastM5ST ? (lastM5ST.st_dir ?? 0) : 0;
                }
                if (lastM1ST) {
                    state[symbol].m1Frozen = { st_value: lastM1ST.st_value, st_dir: lastM1ST.st_dir };
                    state[symbol].prev1mDir = lastM1ST.st_dir ?? null;
                }
                if (m1.length) state[symbol].lastM1Time = m1[m1.length - 1].time;
                updateSysPanel(symbol);
                drawProposalPriceLines(symbol);
                addOpeningRange(symbol, m1);
                addPositionLines(symbol, position);
                updateCloseButton(symbol, !!(position && Math.abs(position.quantity || 0) > 0));
                updateHeader(symbol, m1_bars);
                centerChartView(symbol);

                // ── 构建止损拖动 ctx ──（以 M1 为准）
                const s = state[symbol];
                const lastBar = m1[m1.length - 1] || m5[m5.length - 1];
                const lastST = [...m1STForChart].reverse().find(b => b.st_value != null && b.st_value !== 0);
                const id = symbol;
                const ctx = {
                    sym: symbol, cs: s.candleSeries, chart: s.chart,
                    wrapEl: document.getElementById(`wrap-${id}`),
                    chartEl: document.getElementById(`chart-${id}`),
                    handleEl: document.getElementById(`slh-${id}`),
                    panelEl: document.getElementById(`op-${id}`),
                    latestClose: lastBar.close,
                    latestST: lastST ? lastST.st_value : null,
                    latestSTDir: lastST ? lastST.st_dir : null,
                    slPrice: null, slPriceLine: null, orderDir: 'BUY', orderMode: false,
                    // 订单面板子元素
                    dirBadgeEl: document.getElementById(`opd-${id}`),
                    panelTitleEl: document.getElementById(`opt-${id}`),
                    qtyEl: document.getElementById(`opq-${id}`),
                    riskEl: document.getElementById(`opr-${id}`),
                    slPctEl: document.getElementById(`ops-${id}`),
                    costEl: document.getElementById(`opc-${id}`),
                    hintEl: document.getElementById(`oph-${id}`),
                    maxLossEl: document.getElementById(`opm-${id}`),
                    confirmBtn: document.getElementById(`opconfirm-${id}`),
                };
                s.ctx = ctx;

                // 止损控件 mousedown → 开始拖动（orderMode 或 modifyMode 均可拖动）
                ctx.handleEl.addEventListener('mousedown', e => {
                    if (!ctx.orderMode && !ctx.modifyMode) return;
                    activeDrag = ctx;
                    document.body.style.cursor = 'ns-resize';
                    e.preventDefault();
                });

                // 最大亏损输入 → 重算
                document.getElementById(`opm-${id}`).addEventListener('input', () => updateOrderPanel(ctx));

                // 取消 / ✕ 关闭
                document.getElementById(`opcancel-${id}`).addEventListener('click', () => exitOrderMode(ctx));
                document.getElementById(`opx-${id}`).addEventListener('click', () => exitOrderMode(ctx));

                // 确认开仓 —— 实际调用引擎 API
                document.getElementById(`opconfirm-${id}`).addEventListener('click', async () => {
                    const sl = ctx.slPrice;
                    const entry = ctx.latestClose || 0;
                    const maxLoss = parseFloat(ctx.maxLossEl.value) || 100;
                    const riskPerShare = Math.abs(entry - sl);

                    const acct = ctx.accountInfo || {};
                    const available = acct.available_cash || 0;
                    const total = acct.total_equity || 0;
                    const cashCap = available > 0 ? Math.min(available * 0.9, total) : Infinity;
                    const qtyByLoss = riskPerShare > 0 ? Math.floor(maxLoss / riskPerShare) : 0;
                    const qtyByCash = cashCap < Infinity && entry > 0 ? Math.floor(cashCap / entry) : Infinity;
                    const qty = Math.min(qtyByLoss, qtyByCash);

                    if (!sl || qty <= 0) {
                        showToast('⚠️ 止损价无效或每股风险过小', 'warn');
                        return;
                    }

                    speak(`${symbol} 订单已下发，${ctx.orderDir === 'BUY' ? '做多' : '做空'} ${qty}股，止损 ${sl.toFixed(2)}`);

                    try {
                        const orderBody = { side: ctx.orderDir, qty, stop_loss: sl, order_type: 'BRACKET' };
                        const resp = await (window.NautilusAuth
                            ? window.NautilusAuth.authFetch(`/api/order/${symbol}`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(orderBody),
                              })
                            : fetch(`/api/order/${symbol}`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(orderBody),
                              }));
                        const result = await resp.json();
                        if (result.error && resp.status === 403) {
                            speak(`${symbol} 禁止手动开仓，请先处理 Alpha 建议`, true);
                            showToast(`⚠️ ${result.error}`, 'warn');
                        } else if (result.engine_offline || result.error) {
                            speak(`订单失败，${result.error || '引擎未连接'}`, true);
                            showToast(`⚠️ 引擎未连接或出错: ${result.error || '请启动引擎'}`, 'warn');
                        } else {
                            speak(`${symbol} 订单已受理`, true);
                            showToast(`✅ ${symbol} ${ctx.orderDir === 'BUY' ? '做多' : '做空'} x${qty} 止损$${sl.toFixed(2)} 已下发`, 'ok');
                        }
                    } catch (e) {
                        speak('网络错误，订单失败', true);
                        showToast(`网络错误: ${e.message}`, 'warn');
                    }
                    exitOrderMode(ctx);
                });



                // 图表缩放/滚动后重置控件位置
                s.chart.timeScale().subscribeVisibleLogicalRangeChange(() => {
                    if (ctx.orderMode || ctx.modifyMode) snapHandle(ctx);
                });

                // 点击止损价格线标签（在止损价🧲像素范围内）→ 显示药丸
                s.chart.subscribeClick(param => {
                    if (!param.point || ctx.orderMode || ctx.modifyMode) return;
                    const slP = state[symbol]?.position?.stop_loss;
                    if (!slP) return;
                    const clickedPrice = ctx.cs.coordinateToPrice(param.point.y);
                    if (clickedPrice === null) return;
                    const tolerance = Math.abs(
                        (ctx.cs.coordinateToPrice(0) - ctx.cs.coordinateToPrice(4)) || slP * 0.004
                    );
                    if (Math.abs(clickedPrice - slP) <= tolerance) {
                        enterModifyMode(ctx, slP);
                    }
                });

            } catch (e) {
                const el = document.getElementById(`loading-${symbol}`);
                if (el) el.textContent = `❌ ${e.message}`;
            }
        }


        // ── 事件绑定 ─────────────────────────────────────────────
        function bindEvents(symbol) {
            const s = state[symbol];

            // 开仓按钮（已禁用：仅 Agent 审批后可自动开仓）
            const openBtn = document.getElementById(`btn-open-${symbol}`);
            openBtn.disabled = true;
            openBtn.style.opacity = '0.45';
            openBtn.style.cursor = 'not-allowed';
            openBtn.title = '系统禁止手动开仓，请走 Alpha 审批';
            openBtn.addEventListener('click', () => {
                showToast('系统禁止手动开仓，请走 Alpha 审批', 'warn');
                speak('禁止手动开仓', true);
                return;
            });

            // 平仓
            document.getElementById(`btn-close-${symbol}`).addEventListener('click', async () => {
                const curPos = state[symbol]?.position;
                if (!curPos || Math.abs(curPos.quantity || 0) <= 0) {
                    showToast(`${symbol} 无持仓`, 'tip');
                    return;
                }
                if (!confirm(`确认平仓 ${symbol}？\n\n引擎将自动取消止损单并提交反向市价单。`)) return;
                const btn = document.getElementById(`btn-close-${symbol}`);
                btn.disabled = true;
                btn.textContent = '平仓中…';
                try {
                    const authFetch = window.NautilusAuth?.authFetch || fetch;
                    const resp = await authFetch(`/api/position/${symbol}`, { method: 'DELETE' });
                    const result = await resp.json();
                    if (!resp.ok) {
                        speak(`${symbol} 平仓失败`, true);
                        showToast(`⚠️ ${result.error || '平仓失败'}${result.hint ? ' · ' + result.hint : ''}`, 'warn');
                    } else if (result.engine?.error) {
                        speak(`${symbol} 平仓失败`, true);
                        alert(`❌ 平仓失败: ${result.engine.error}`);
                    } else {
                        speak(`${symbol} 平仓指令已发出`, true);
                        if (result.routed === 'auto_pm') {
                            showToast(`✅ ${symbol} 已路由 AutoPM，等待成交确认`, 'ok');
                        }
                    }
                } catch (e) {
                    alert(`网络错误: ${e.message}`);
                } finally {
                    btn.textContent = '平仓';
                    const hasPos = !!(state[symbol]?.position && Math.abs(state[symbol].position.quantity || 0) > 0);
                    updateCloseButton(symbol, hasPos);
                }
            });


            // ST 跟踪止盈
            document.getElementById(`st-toggle-${symbol}`).addEventListener('change', async e => {
                const on = e.target.checked;
                await fetch(`/api/settings/${symbol}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ st_trail: on }),
                });
                const lbl = document.getElementById(`st-label-${symbol}`);
                lbl.style.color = on ? '#26a69a' : '#787b86';
            });

            // 自动策略（关 / 观察 / 实盘）
            const autoSel = document.getElementById(`auto-sel-${symbol}`);
            const AUTO_COLORS = { off: '#2a2e39', observe: '#f0b90b', live: '#ef5350' };
            function applyAutoStyle(mode) {
                s.autoMode = mode;
                autoSel.style.borderColor = AUTO_COLORS[mode] || '#2a2e39';
                autoSel.style.color = mode === 'off' ? '#787b86' : (AUTO_COLORS[mode] || '#d1d4dc');
            }
            autoSel.addEventListener('change', async () => {
                let mode = autoSel.value;
                if (mode === 'live' &&
                    !confirm(`确认让 ${symbol} 进入【实盘自动策略】？`)) {
                    mode = 'observe';
                    autoSel.value = 'observe';
                }
                const body = {
                    auto_strategy: mode === 'live',
                    auto_observe:  mode === 'observe',
                };
                if (mode !== 'off') body.trail_mode = 0;
                applyAutoStyle(mode);
                updateSysPanel(symbol);
                await fetch(`/api/settings/${symbol}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                const label = mode === 'live' ? '实盘' : (mode === 'observe' ? '观察' : '关闭');
                showToast(`${symbol} 自动策略：${label}`, mode === 'live' ? 'warn' : 'tip');
            });
            (async () => {
                try {
                    const res = await fetch(`/api/settings/${symbol}`);
                    if (res.ok) {
                        const st = await res.json();
                        const m = st.auto_strategy ? 'live' : (st.auto_observe ? 'observe' : 'off');
                        autoSel.value = m;
                        applyAutoStyle(m);
                        updateSysPanel(symbol);
                    }
                } catch (_) { /* 引擎离线 */ }
            })();
        }

        // ── 全局拖动事件（绑在 document 层）──────────────────────
        document.addEventListener('mousemove', e => {
            if (!activeDrag) return;
            const { wrapEl, chartEl, handleEl } = activeDrag;
            const wRect = wrapEl.getBoundingClientRect();
            const eRect = chartEl.getBoundingClientRect();
            const containerY = e.clientY - wRect.top;
            const chartY = e.clientY - eRect.top;
            const price = activeDrag.cs.coordinateToPrice(chartY);
            if (price === null) return;
            handleEl.style.top = containerY + 'px';
            activeDrag.slPrice = parseFloat(price.toFixed(2));
            updateHandlePriceLabel(activeDrag);
            if (activeDrag.modifyMode) {
                // modifyMode：创建或更新临时橙色跟踪线
                if (!activeDrag.modifyTempLine) {
                    activeDrag.modifyTempLine = activeDrag.cs.createPriceLine({
                        price: activeDrag.slPrice, color: '#ff9800', lineWidth: 1,
                        lineStyle: LightweightCharts.LineStyle.Dashed,
                        axisLabelVisible: true, title: '→ 新止损',
                    });
                } else {
                    activeDrag.modifyTempLine.applyOptions({
                        price: activeDrag.slPrice,
                        title: `→ ${activeDrag.slPrice.toFixed(2)}`,
                    });
                }
            } else {
                updateOrderPanel(activeDrag);
            }
        });

        document.addEventListener('mouseup', () => {
            if (!activeDrag) return;
            const ctx = activeDrag;
            activeDrag = null;
            document.body.style.cursor = '';

            // modifyMode：移除临时线 + 捯手后消失药丸 + 调 API
            if (ctx.modifyMode && ctx.slPrice) {
                if (ctx.modifyTempLine) {
                    try { ctx.cs.removePriceLine(ctx.modifyTempLine); } catch (_) { }
                    ctx.modifyTempLine = null;
                }
                const newPrice = ctx.slPrice;
                exitModifyMode(ctx);  // 药丸立即消失
                const authFetch = window.NautilusAuth?.authFetch || fetch;
                authFetch(`/api/modify-stop/${ctx.sym}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ price: newPrice }),
                }).then(r => r.json()).then(result => {
                    if (!result.ok) {
                        speak(`${ctx.sym} 止损修改失败`, true);
                        showToast(`⚠️ ${ctx.sym} 止损修改失败: ${result.error}`, 'warn');
                    } else {
                        // 成功：把原止损线移到新价格
                        if (state[ctx.sym]?.slPriceLine) {
                            state[ctx.sym].slPriceLine.applyOptions({
                                price: newPrice,
                                title: `止损 ${newPrice.toFixed(2)}`,
                            });
                        }
                        if (state[ctx.sym]?.position) {
                            state[ctx.sym].position.stop_loss = newPrice;
                            document.getElementById(`p-sl-${ctx.sym}`).textContent = newPrice.toFixed(2);
                        }
                        showToast(`✅ ${ctx.sym} 止损已修改为 ${newPrice.toFixed(2)}`, 'ok');
                    }
                }).catch(e => showToast(`网络错误: ${e.message}`, 'warn'));
            } else {
                snapHandle(ctx);
            }
        });

        // 止损控件精确对齐（priceToCoordinate + offset）
        function snapHandle(ctx) {
            const y = ctx.cs.priceToCoordinate(ctx.slPrice);
            if (y === null) return;
            const offset = ctx.chartEl.getBoundingClientRect().top - ctx.wrapEl.getBoundingClientRect().top;
            ctx.handleEl.style.top = (y + offset) + 'px';
        }

        // 更新药丸价格标签
        function updateHandlePriceLabel(ctx) {
            ctx.handleEl.querySelector('.sl-price').textContent = ctx.slPrice.toFixed(2);
            const el = ctx.panelEl.querySelector('.op-sl-val');
            if (el) el.textContent = ctx.slPrice.toFixed(2);
        }

        // 核心：自动判方向 + 算股数（双上限） + 更新面板
        function updateOrderPanel(ctx) {
            const entry = ctx.latestClose || 0;
            if (!ctx.slPrice || !entry) return;
            const { slPrice } = ctx;

            const isBuy = slPrice < entry;
            ctx.orderDir = isBuy ? 'BUY' : 'SELL';
            ctx.dirBadgeEl.className = `op-dir-badge ${isBuy ? 'buy' : 'sell'}`;
            ctx.dirBadgeEl.textContent = isBuy ? '▲ 做多' : '▼ 做空';
            ctx.panelTitleEl.textContent = isBuy ? '做多开仓' : '做空开仓';
            ctx.confirmBtn.className = `op-btn confirm ${isBuy ? '' : 'sell'}`;
            ctx.confirmBtn.textContent = isBuy ? '确认做多' : '确认做空';

            const riskPerShare = Math.abs(entry - slPrice);
            const slPct = entry > 0 ? (riskPerShare / entry * 100) : 0;
            ctx.riskEl.textContent = riskPerShare > 0 ? `$${riskPerShare.toFixed(2)}` : '—';
            ctx.slPctEl.textContent = slPct > 0 ? `${slPct.toFixed(2)}%` : '—';

            // ── 股数：最大亏损 + 资金上限 取较小値 ──
            const maxLoss = parseFloat(ctx.maxLossEl.value) || 100;
            const acct = ctx.accountInfo || {};
            const available = acct.available_cash || 0;
            const total = acct.total_equity || 0;
            const cashCap = available > 0 ? Math.min(available * 0.9, total) : Infinity;
            const qtyByLoss = riskPerShare > 0 ? Math.floor(maxLoss / riskPerShare) : 0;
            const qtyByCash = cashCap < Infinity && entry > 0 ? Math.floor(cashCap / entry) : Infinity;
            const qty = Math.min(qtyByLoss, qtyByCash);
            ctx.qtyEl.textContent = qty > 0 ? `${qty} 股` : '—';
            ctx.qtyEl.style.color = qty > 0 ? '#d1d4dc' : '#787b86';
            ctx.qtyEl.title = (qty > 0 && qtyByCash < qtyByLoss)
                ? `按止损可开 ${qtyByLoss} 股，因资金上限抽到 ${qty} 股` : '';

            const cost = qty * entry;
            ctx.costEl.textContent = qty > 0 ? `$${cost.toFixed(0)}` : '—';
            if (qty > 0 && total > 0) {
                ctx.hintEl.textContent = `💡 占用 $${cost.toFixed(0)}（账户$${(total / 10000).toFixed(1)}万的 ${(cost / total * 100).toFixed(1)}%）`;
            } else if (qty > 0) {
                ctx.hintEl.textContent = `💡 占用 $${cost.toFixed(0)}（引擎未连接，资金校验已跳过）`;
            } else {
                ctx.hintEl.textContent = '请拖动止损控件';
            }
            if (ctx.slPriceLine) {
                ctx.slPriceLine.applyOptions({ price: slPrice, title: `止损 ${slPrice.toFixed(2)}` });
            }
        }

        // 进入开仓模式（异步获取真实账户余额）
        async function enterOrderMode(ctx) {
            showToast('系统禁止手动开仓，请走 Alpha 审批', 'warn');
            speak('禁止手动开仓', true);
        }

        // 退出开仓模式
        function exitOrderMode(ctx) {
            ctx.orderMode = false;
            if (ctx.slPriceLine) { ctx.cs.removePriceLine(ctx.slPriceLine); ctx.slPriceLine = null; }
            ctx.handleEl.classList.remove('active');
            ctx.panelEl.classList.remove('active');
            // 隐藏遮罩层
            const overlay = document.getElementById('orderPanelOverlay');
            if (overlay) { overlay.classList.remove('active'); overlay.onclick = null; }
            activeDrag = null;
            document.body.style.cursor = '';
            // 如果持仓且有止损价，自动切回 modifyMode
            if (state[ctx.sym]?.position?.stop_loss) {
                enterModifyMode(ctx, state[ctx.sym].position.stop_loss);
            }
        }

        // 进入止损修改模式（持仓期间橙色药丸常显）
        function enterModifyMode(ctx, slPx) {
            if (ctx.orderMode) return;  // 开仓模式优先
            ctx.modifyMode = true;
            ctx.slPrice = parseFloat(slPx.toFixed ? slPx.toFixed(2) : slPx);
            ctx.handleEl.classList.remove('active');
            ctx.handleEl.classList.add('modify');
            updateHandlePriceLabel(ctx);
            snapHandle(ctx);
        }

        // 退出止损修改模式
        function exitModifyMode(ctx) {
            ctx.modifyMode = false;
            ctx.handleEl.classList.remove('modify');
        }


        // ── WebSocket 实时更新 ──────────────────────────────────
        function connectWS() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            const ws = new WebSocket(`${proto}://${location.host}`);
            ws.onmessage = ({ data }) => {
                try {
                    const { channel, data: payload } = JSON.parse(data);

                    // ── 真实 IBKR 仓位推送（无 :symbol 后缀，提前处理）──
                    if (channel === 'position:update') {
                        const posSym = payload.symbol;
                        if (posSym && state[posSym]) {
                            if (payload.closed) {
                                // 平仓标记（橙色圆点）
                                const ct = state[posSym].lastTickTime;
                                if (ct) {
                                    const wasLong = state[posSym].position
                                        ? state[posSym].position.side !== 'SHORT' : true;
                                    state[posSym].orderMarkers.push({
                                        time: ct,
                                        position: wasLong ? 'aboveBar' : 'belowBar',
                                        color: '#ff9800',
                                        shape: 'circle',
                                        text: '平仓',
                                        size: 0.8,
                                    });
                                    refreshMarkers(posSym);
                                }
                                clearPositionUI(posSym);
                                // clearPositionUI 已内含 exitModifyMode
                                speak(`${posSym} 仓位已平仓`, true);
                            } else {
                                const isNew = !state[posSym].position;
                                addPositionLines(posSym, payload);
                                // 注意：不自动 enterModifyMode，等用户点击止损线
                                if (isNew) speak(`${posSym} ${payload.side === 'SHORT' ? '做空' : '做多'}开仓成功`, true);
                            }
                        }
                        return;
                    }

                    // ── Alpha 建议审批 ─────────────────────────────────────
                    if (channel === 'proposal:update') {
                        refreshAlphaPanels();
                        const ev = payload;
                        const sym = ev.symbol ? String(ev.symbol).toUpperCase() : '';
                        if (!sym) return;

                        const isNewPending = (
                            ev.event === 'created'
                            || (!ev.event && ev.status === 'pending' && ev.proposal_id)
                        );
                        if (isNewPending && ev.proposal_id && !_knownPendingIds.has(ev.proposal_id)) {
                            _knownPendingIds.add(ev.proposal_id);
                            onNewProposalDetected(ev);
                            return;
                        }

                        if (!DEFAULT_SYMBOLS.includes(sym)) return;
                        if (ev.event === 'executing') {
                            if (window.AlphaCell) AlphaCell.setExecuting(sym, ev.proposal_id);
                            showToast(`⏳ ${sym} Agent 报单中…`, 'tip');
                        } else if (ev.event === 'submit_failed') {
                            if (window.AlphaCell) AlphaCell.clearExecuting(sym);
                            speak(`${sym} 报单失败`, true);
                            showToast(`⚠️ ${sym} 报单失败 · ${ev.reason || '待下一根 M1 重试'}`, 'warn');
                        } else if (ev.event === 'executed') {
                            if (window.AlphaCell) AlphaCell.clearExecuting(sym);
                            if (window.AlphaWorkflow) AlphaWorkflow.onApprovalResolved(sym);
                            clearProposalPriceLines(sym);
                            const result = ev.result || 'executed';
                            const label = window.AlphaCopy?.execResultLabel(result) || result;
                            speak(`${sym} ${label}`, true);
                            showToast(`✅ ${sym} ${label}`, result === 'risk_rejected' ? 'warn' : 'tip');
                        } else if (ev.event === 'reclaim_ready') {
                            speak(`${sym} 回踩完成，待执行`, true);
                            showToast(`📋 ${sym} 回踩完成 · 待执行`, 'tip');
                            focusCell(sym);
                        } else if (ev.event === 'reclaim_failed') {
                            if (window.AlphaWorkflow) AlphaWorkflow.onApprovalResolved(sym);
                            clearProposalPriceLines(sym);
                            speak(`${sym} 回踩失败`, true);
                            showToast(`❌ ${sym} 回踩失败 · ${ev.reason || '条件未满足'}`, 'warn');
                        } else if (ev.event === 'cancelled') {
                            if (window.AlphaCell) AlphaCell.clearExecuting(sym);
                            if (window.AlphaWorkflow) AlphaWorkflow.onApprovalResolved(sym);
                            clearProposalPriceLines(sym);
                            speak(`${sym} 已取消批准`, true);
                            showToast(`📋 ${sym} 已取消批准`, 'tip');
                        } else if (ev.event === 'approved_live' || ev.event === 'approved_observe') {
                            if (window.AlphaWorkflow) AlphaWorkflow.onApprovalResolved(sym);
                            const live = ev.event === 'approved_live';
                            speak(`${sym} 已批准${live ? '实盘' : '观察'}`, true);
                            showToast(
                                `✅ ${sym} 已批准 · Agent${live ? '执行' : '观察'}已开`,
                                live ? 'warn' : 'tip',
                            );
                            const sel = document.getElementById(`auto-sel-${sym}`);
                            if (sel) {
                                const mode = live ? 'live' : 'observe';
                                sel.value = mode;
                                sel.style.borderColor = live ? '#ef5350' : '#f0b90b';
                                sel.style.color = live ? '#ef5350' : '#f0b90b';
                                if (state[sym]) state[sym].autoMode = mode;
                            }
                            focusCell(sym);
                        } else if (ev.event === 'rejected') {
                            if (window.AlphaWorkflow) AlphaWorkflow.onApprovalResolved(sym);
                            showToast(`❌ ${sym} 建议已驳回`, 'tip');
                        }
                        return;
                    }

                    if (channel === 'signal:touch') {
                        applyBackendTouch(payload, { announce: true, autoShow: true });
                        return;
                    }
                    if (channel === 'signal:touch:backfill') {
                        applyBackendTouch(payload, { announce: false, autoShow: false });
                        return;
                    }

                    // ── 全自动策略信号 ─────────────────────────────────────
                    if (channel === 'auto:signal') {
                        const sig = payload;
                        const sym = sig.symbol;
                        if (!sym || !state[sym]) return;
                        const sideZh = sig.side === 'SELL' ? '空' : '多';
                        switch (sig.action) {
                            case 'would_open':
                                speak(`${sym} 观察：应开${sideZh}`, true);
                                showToast(`👁 ${sym} 观察信号 应开${sideZh}`, 'tip');
                                break;
                            case 'open': {
                                const prop = window.AlphaCell?.phaseForSymbol(sym)?.proposal;
                                if (window.AlphaCell && prop) AlphaCell.setExecuting(sym, prop.proposal_id);
                                const pid = sig.proposal_id || prop?.proposal_id;
                                const tag = pid ? ` #${String(pid).slice(-6)}` : '';
                                speak(`${sym} Agent开仓 ${sideZh}`, true);
                                showToast(`🤖 ${sym} Agent 开仓 ${sideZh}${tag}`, 'warn');
                                focusCell(sym);
                                break;
                            }
                            case 'rejected': {
                                if (window.AlphaCell) AlphaCell.clearExecuting(sym);
                                const reason = sig.reason || '风控/条件拒绝';
                                const pid = sig.proposal_id ? ` #${String(sig.proposal_id).slice(-6)}` : '';
                                speak(`${sym} Agent拒绝 ${reason}`, true);
                                showToast(`⛔ ${sym} Agent 未执行${pid} · ${reason}`, 'warn');
                                refreshAlphaPanels();
                                break;
                            }
                            case 'reversal':
                                speak(`${sym} 自动反转平仓`, true);
                                showToast(`🔄 ${sym} 反转全平`, 'warn');
                                break;
                            case 'eod':
                                speak(`${sym} 尾盘自动平仓`, true);
                                break;
                            case 'unit_stop':
                                speak(`${sym} 自动止损成交`, true);
                                break;
                        }
                        return;
                    }

                    // ── 引擎订单状态回执（order_actor.py 通过 Redis 发布）──
                    if (channel === 'order:update') {
                        const o = payload;
                        const sym = o.symbol || '未知';
                        const side = o.side === 'BUY' ? '做多' : '做空';
                        const id = (o.client_order_id || '').slice(-6);
                        switch (o.status) {
                            case 'ACCEPTED':
                            case 'UPDATED': {
                                // 止损单被接受/修改时（STOP_MARKET + trigger_price）→ 更新止损线
                                if (o.order_type === 'STOP_MARKET' && o.trigger_price) {
                                    const slPrice = parseFloat(o.trigger_price);
                                    // 更新图表止损价格线
                                    if (state[sym]?.slPriceLine) {
                                        state[sym].slPriceLine.applyOptions({
                                            price: slPrice,
                                            title: `止损 ${slPrice.toFixed(2)}`,
                                        });
                                    }
                                    if (state[sym]?.position) {
                                        state[sym].position.stop_loss = slPrice;
                                        const slEl = document.getElementById(`p-sl-${sym}`);
                                        if (slEl) slEl.textContent = slPrice.toFixed(2);
                                    }
                                    if (o.status === 'ACCEPTED') {
                                        showToast(`✅ ${sym} 止损单已接受 @ ${slPrice.toFixed(2)}`, 'ok');
                                    } else {
                                        showToast(`🔄 ${sym} 止损价已更新 → ${slPrice.toFixed(2)}`, 'ok');
                                    }
                                } else if (o.status === 'ACCEPTED') {
                                    speak(`${sym} 订单已接受`, true);
                                    showToast(`✅ ${sym} 订单已接受 #${id}`, 'ok');
                                }
                                break;
                            }

                            case 'FILLED': {
                                // 判断是开仓还是平仓：若当前有持仓且成交方向与持仓方向相反 → 平仓
                                const fillSym = sym;
                                const curPos = state[fillSym]?.position;
                                const isBuy = o.side === 'BUY';
                                const isClose = curPos
                                    ? (curPos.side === 'LONG' && !isBuy) || (curPos.side === 'SHORT' && isBuy)
                                    : false;

                                if (isClose) {
                                    speak(`${sym} 平仓成交，成交价 ${o.last_px}`, true);
                                    showToast(`✅ ${sym} 平仓成交 @${o.last_px} x${o.last_qty}`, 'ok');
                                } else {
                                    const wasAgent = window.AlphaCell?.isExecuting(fillSym);
                                    if (wasAgent) {
                                        window.AlphaCell.clearExecuting(fillSym);
                                        clearProposalPriceLines(fillSym);
                                    }
                                    speak(`${sym} ${side}订单成交，成交价 ${o.last_px}`, true);
                                    showToast(`✅ ${sym} ${side}成交 @${o.last_px} x${o.last_qty}${wasAgent ? ' · Agent' : ''}`, 'ok');
                                    const fillPrice = parseFloat(o.last_px);
                                    const fillQty = parseFloat(o.last_qty);
                                    if (state[fillSym] && fillPrice && !Number.isNaN(fillPrice)) {
                                        const prop = window.AlphaCell?.phaseForSymbol(fillSym)?.proposal;
                                        const stopFromProp = prop ? Number(prop.stop_price) : null;
                                        addPositionLines(fillSym, {
                                            symbol: fillSym,
                                            side: isBuy ? 'LONG' : 'SHORT',
                                            quantity: fillQty || curPos?.quantity || 0,
                                            avg_px_open: fillPrice,
                                            entry_price: fillPrice,
                                            stop_loss: (stopFromProp && !Number.isNaN(stopFromProp))
                                                ? stopFromProp
                                                : (curPos?.stop_loss || null),
                                        });
                                    }
                                }

                                // 成交标记（平仓或无仓位线时补 marker）
                                if (state[fillSym] && isClose) {
                                    const ft = state[fillSym].lastTickTime;
                                    if (ft) {
                                        state[fillSym].orderMarkers.push({
                                            time: ft,
                                            position: isBuy ? 'belowBar' : 'aboveBar',
                                            color: '#ff9800',
                                            shape: 'circle',
                                            text: `平仓 @${o.last_px}`,
                                            size: 0.8,
                                        });
                                        refreshMarkers(fillSym);
                                    }
                                }
                                break;
                            }
                            case 'PARTIALLY_FILLED':
                                speak(`${sym} 订单部分成交`, true);
                                showToast(`🔶 ${sym} 部分成交 @${o.last_px} x${o.last_qty}`, 'tip');
                                break;
                            case 'REJECTED':
                                speak(`${sym} 订单被拒绝，${o.reason || ''}`, true);
                                showToast(`❌ ${sym} 订单拒绝: ${o.reason || ''}`, 'warn');
                                break;
                            case 'DENIED':
                                speak(`${sym} 订单被风控拒绝，${o.reason || ''}`, true);
                                showToast(`❌ ${sym} 风控拒绝: ${o.reason || ''}`, 'warn');
                                break;
                            case 'TRIGGERED': {
                                speak(`${sym} 止损单已触发，注意`, true);
                                showToast(`🔔 ${sym} 止损单触发`, 'tip');
                                // 止损触发标记（黄色圆点）
                                const trigSym = sym;
                                if (state[trigSym]) {
                                    const tt = state[trigSym].lastTickTime;
                                    if (tt) {
                                        state[trigSym].orderMarkers.push({
                                            time: tt,
                                            position: 'aboveBar',
                                            color: '#f59e0b',
                                            shape: 'circle',
                                            text: '止损触发',
                                            size: 0.8,
                                        });
                                        refreshMarkers(trigSym);
                                    }
                                }
                                break;
                            }
                            case 'CANCELED':
                                showToast(`⛔ ${sym} 订单已取消 #${id}`, 'info');
                                break;
                            case 'EXPIRED':
                                speak(`${sym} 订单已过期`, true);
                                showToast(`⌛ ${sym} 订单过期 #${id}`, 'tip');
                                break;
                            default:
                                showToast(`📎 ${sym} 订单状态: ${o.status}`, 'info');
                        }
                        return;
                    }

                    // ── 第一步：从 channel 末段提取 symbol ────────────────
                    const sym = DEFAULT_SYMBOLS.find(s => channel.endsWith(`:${s}`));
                    if (!sym || !state[sym]) return;

                    // ── 第二步：payload.symbol 二次校验（防止数据串台）─────
                    if (payload.symbol && payload.symbol !== sym) {
                        console.error(`[WS串台拦截] channel=${channel} 对应 ${sym}，但 payload.symbol=${payload.symbol}，已丢弃`);
                        return;
                    }


                    const s = state[sym];
                    if (!chartsReady) return;

                    // tick 实时推送：刷进正在形成的 1m 蜡烛
                    if (channel.startsWith('bars:1m:tick:')) {
                        s.lastTickTime = payload.time;
                        feedForming1m(s, payload.open, payload.high, payload.low, payload.close, payload.time);
                        if (s.ctx) s.ctx.latestClose = payload.close;
                        const priceEl = document.getElementById(`price-${sym}`);
                        if (priceEl) priceEl.textContent = payload.close.toFixed(2);
                        return;
                    }
                    // kline:1m 收盘：1m 蜡烛定型 + 1m ST 刷新（主图已是 M1）
                    if (channel.startsWith('kline:1m:')) {
                        if (payload.time < s.lastM1Time) return;
                        s.lastM1Time = payload.time;
                        s.lastTickTime = payload.time;
                        feedForming1m(s, payload.open, payload.high, payload.low, payload.close, payload.time);
                        // 1m ST：用引擎 payload 的 st_value/st_dir（04:00 预热权威值）
                        if (payload.st_value != null && payload.st_dir != null && payload.st_value > 0) {
                            if (s.st1) s.st1.update(payload.open, payload.high, payload.low, payload.close);
                            updateM1STForSymbol(sym, payload.time, payload.st_value, payload.st_dir);
                            s.m1Frozen = { st_value: payload.st_value, st_dir: payload.st_dir };
                            s.prev1mDir = payload.st_dir;
                        }
                        // 行情变动：更新 latestClose，刷新仓位浮盈面板
                        if (s.ctx) s.ctx.latestClose = payload.close;
                        const priceEl = document.getElementById(`price-${sym}`);
                        if (priceEl) priceEl.textContent = payload.close.toFixed(2);
                        if (s.position) {
                            const pos = s.position;
                            const ep = pos.avg_px_open ?? pos.entry_price;
                            if (ep) {
                                pos.unrealized_pnl =
                                    (payload.close - ep) * pos.quantity *
                                    (pos.side === 'SHORT' ? -1 : 1);
                                refreshPositionPanel(sym, pos);
                            }
                        }
                        updateSysPanel(sym);
                        return;
                    }
                    if (channel.startsWith('kline:5m:')) {
                        // 5m 收盘：更新 5m ST 状态 + 粗线阶梯延伸（主图 M1 蜡烛由 kline:1m 负责，1m ST 由 kline:1m 刷新）
                        if (payload.open != null) {
                            let val = payload.st_value;
                            let dir = payload.st_dir;
                            if (s.st5) {
                                const [cv, cd] = s.st5.update(payload.open, payload.high, payload.low, payload.close);
                                if (val == null || dir == null) { val = cv; dir = cd; }
                            }
                            if (val > 0 && dir != null && dir !== 0) {
                                if (s.stM5LastDir != null && dir !== s.stM5LastDir) {
                                    speak(`${sym} 五分钟超级趋势转${dir === 1 ? '向上' : '向下'}，注意转向`, true);
                                }
                                s.st5Dir = dir;
                                s.m5Frozen = { st_value: val, st_dir: dir, dema20: payload.dema20 ?? s.m5Frozen?.dema20 };
                                // 5m ST 粗线铺到 1m 轴：用 5m 桶末的 1m 时间
                                const m1t = payload.m1_bar_time ?? payload.time;
                                updateM5IndicatorsForSymbol(sym, m1t);
                            }
                        }
                        updateSysPanel(sym);
                        return;
                    }




                } catch (err) {
                    console.error('[WS处理错误]', err.message, err);
                }
            };
            ws.onclose = () => setTimeout(connectWS, 3000);
        }

        function clearProposalPriceLines(symbol) {
            const s = state[symbol];
            if (!s?.candleSeries) return;
            const lines = s.proposalPriceLines || {};
            for (const key of ['trigger', 'stop', 'tp']) {
                if (lines[key]) {
                    try { s.candleSeries.removePriceLine(lines[key]); } catch (_) {}
                    lines[key] = null;
                }
            }
            s.proposalPriceLines = lines;
            if (s.triggerPriceLine) s.triggerPriceLine = null;
        }

        function drawProposalPriceLines(symbol) {
            const s = state[symbol];
            if (!s?.candleSeries) return;
            clearProposalPriceLines(symbol);
            const prop = window.AlphaCell?.phaseForSymbol(symbol)?.proposal;
            if (!prop) return;
            const lines = {};
            const trigger = Number(prop.trigger_level);
            const stop = Number(prop.stop_price);
            const tp = Number(prop.tp_half_price ?? prop.tp_price);
            if (trigger && !Number.isNaN(trigger)) {
                lines.trigger = s.candleSeries.createPriceLine({
                    price: trigger,
                    color: '#2962ff',
                    lineWidth: 1,
                    lineStyle: LightweightCharts.LineStyle.Dotted,
                    axisLabelVisible: true,
                    title: `触发 ${trigger}`,
                });
            }
            if (stop && !Number.isNaN(stop)) {
                lines.stop = s.candleSeries.createPriceLine({
                    price: stop,
                    color: '#ef5350',
                    lineWidth: 1,
                    lineStyle: LightweightCharts.LineStyle.Dashed,
                    axisLabelVisible: true,
                    title: `止损 ${stop}`,
                });
            }
            if (tp && !Number.isNaN(tp)) {
                lines.tp = s.candleSeries.createPriceLine({
                    price: tp,
                    color: '#26a69a',
                    lineWidth: 1,
                    lineStyle: LightweightCharts.LineStyle.Dashed,
                    axisLabelVisible: true,
                    title: `TP½ ${tp}`,
                });
            }
            s.proposalPriceLines = lines;
            s.triggerPriceLine = lines.trigger || null;
        }

        // ── 启动 ────────────────────────────────────────────────
        initSlotMetaFromGrid();
        // 图表：超级信号（ST 5m/1m）；审批：Alpha 提案流水线（扫描→审批→回踩→执行）不可跳过
        DEFAULT_SYMBOLS.forEach((sym, idx) => {
            document.getElementById('grid').appendChild(createCell(sym, idx));
            initChart(sym);
            bindEvents(sym);
            updateSysPanel(sym);
        });
        // 初始化已知 pending，避免首次轮询误报
        fetch('/api/proposals?status=pending&limit=200')
            .then(r => r.json())
            .then(d => (d.proposals || []).forEach(p => _knownPendingIds.add(p.proposal_id)))
            .catch(() => {})
            .finally(() => StatusBar.startPolling(15000, syncAlphaFromSnapshot));
        Promise.all(DEFAULT_SYMBOLS.map(sym => loadSymbol(sym))).then(() => {
            chartsReady = true;
            playPostReloadAlert();
            DEFAULT_SYMBOLS.forEach(drawProposalPriceLines);
            const focusSym = new URLSearchParams(location.search).get('focus')?.toUpperCase();
            if (focusSym && SYMBOL_UNIVERSE.includes(focusSym)) {
                if (DEFAULT_SYMBOLS.includes(focusSym)) {
                    setTimeout(() => {
                        const prop = window.AlphaCell?.phaseForSymbol(focusSym)?.proposal;
                        focusApprovalCell(focusSym, prop);
                    }, 400);
                } else {
                    autoAssignSymbolToGrid(focusSym, 'proposal');
                }
            }
            // ── 十字线联动（悬停任一图，其余三图同步显示十字线）──────
            DEFAULT_SYMBOLS.forEach(sym => wireCrosshairForSymbol(sym));
        });
        connectWS();

    </script>
</body>

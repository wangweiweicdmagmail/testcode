<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Chart Dashboard</title>
    <script
        src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #131722;
            color: #d1d4dc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ── 顶部导航栏 ── */
        #nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 14px;
            background: #1e222d;
            border-bottom: 1px solid #2a2e39;
            flex-shrink: 0;
        }

        #nav h1 {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
        }

        .nav-links {
            display: flex;
            gap: 10px;
        }

        .nav-links a {
            font-size: 12px;
            color: #787b86;
            text-decoration: none;
            padding: 3px 10px;
            border-radius: 4px;
            transition: background .15s;
        }

        .nav-links a:hover {
            background: #2a2e39;
            color: #d1d4dc;
        }

        .nav-links a.active {
            background: rgba(41, 98, 255, .15);
            color: #2962ff;
        }

        /* ── 2×2 网格 ── */
        #grid {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 1px;
            background: #2a2e39;
            overflow: hidden;
        }

        /* ── 单元格 ── */
        .cell {
            background: #131722;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ── 单元格头部（与 index.html #toolbar 对齐） ── */
        .c-toolbar {
            display: flex;
            align-items: center;
            padding: 4px 10px;
            background: #1e222d;
            border-bottom: 1px solid #2a2e39;
            flex-shrink: 0;
            min-height: 52px;
            gap: 0;
        }

        /* 左列 */
        .c-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
            min-width: 0;
        }

        .c-left-r1 {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .c-left-r2 {
            display: flex;
            align-items: center;
            min-height: 16px;
        }

        .c-symbol {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
        }

        .c-price {
            font-size: 14px;
            font-weight: 600;
        }

        .c-change {
            font-size: 11px;
            padding: 1px 6px;
            border-radius: 3px;
        }

        /* 十字线 OHLC */
        .c-crosshair {
            display: none;
            align-items: center;
            gap: 0;
            font-size: 11px;
            font-family: 'Roboto Mono', monospace, sans-serif;
        }

        .c-ci-item {
            display: flex;
            align-items: center;
            margin-right: 8px;
        }

        .c-ci-label {
            color: #787b86;
            margin-right: 2px;
            font-size: 10px;
        }

        .c-ci-val {
            font-weight: 600;
            font-size: 11px;
            color: #d1d4dc;
        }

        .c-ci-time {
            color: #4b5563;
            font-size: 10px;
            margin-right: 10px;
        }

        /* 右列 */
        .c-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        /* 仓位面板 */
        .c-pos-panel {
            display: none;
            background: rgba(30, 34, 45, .6);
            border: 1px solid #2a2e39;
            border-radius: 4px;
            padding: 3px 8px;
            font-size: 11px;
            line-height: 1.6;
        }

        .c-pos-row {
            display: flex;
            gap: 12px;
        }

        .c-pos-item label {
            color: #787b86;
            margin-right: 3px;
        }

        .c-pos-item span {
            font-weight: 600;
        }

        /* 操作按钮区 */
        .c-actions {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        /* 标的切换下拉 */
        .c-sym-sel {
            background: #131722;
            color: #d1d4dc;
            border: 1px solid #2a2e39;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 11px;
            cursor: pointer;
        }

        /* ST 跟踪止盈 toggle */
        .c-toggle-wrap {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: #787b86;
        }

        .c-toggle {
            position: relative;
            display: inline-block;
            width: 30px;
            height: 17px;
        }

        .c-toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .c-slider {
            position: absolute;
            inset: 0;
            background: #2a2e39;
            border-radius: 17px;
            cursor: pointer;
            transition: background .2s;
        }

        .c-slider:before {
            content: '';
            position: absolute;
            width: 11px;
            height: 11px;
            left: 3px;
            top: 3px;
            background: #d1d4dc;
            border-radius: 50%;
            transition: transform .2s;
        }

        .c-toggle input:checked+.c-slider {
            background: #26a69a;
        }

        .c-toggle input:checked+.c-slider:before {
            transform: translateX(13px);
        }

        /* 按钮 */
        .c-btn {
            padding: 3px 10px;
            border-radius: 4px;
            border: none;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity .15s;
        }

        .c-btn:hover {
            opacity: .82;
        }

        .c-btn-open {
            background: #26a69a;
            color: #fff;
        }

        .c-btn-close {
            background: #ef5350;
            color: #fff;
        }

        /* ── 图表区 ── */
        .c-chart-wrap {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .c-chart {
            width: 100%;
            height: 100%;
        }

        /* 图例 */
        .c-legend {
            position: absolute;
            top: 6px;
            left: 8px;
            display: flex;
            gap: 10px;
            font-size: 10px;
            pointer-events: none;
            z-index: 10;
        }

        .c-legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .c-legend-dot {
            width: 8px;
            height: 2px;
            border-radius: 1px;
        }

        /* 加载遮罩 */
        .c-loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #131722;
            font-size: 13px;
            color: #787b86;
            z-index: 100;
        }

        /* 颜色工具类 */
        .up {
            color: #26a69a;
        }

        .down {
            color: #ef5350;
        }

        .up-bg {
            background: rgba(38, 166, 154, .15);
        }

        .down-bg {
            background: rgba(239, 83, 80, .15);
        }

        /* ── 止损药丸拖动控件 ── */
        .sl-handle {
            display: none;
            position: absolute;
            right: 58px;
            transform: translateY(-50%);
            align-items: center;
            gap: 5px;
            background: #ef5350;
            border-radius: 16px;
            padding: 4px 10px 4px 8px;
            cursor: ns-resize;
            z-index: 50;
            user-select: none;
            box-shadow: 0 2px 8px rgba(239, 83, 80, .5);
            white-space: nowrap;
            font-size: 11px;
        }

        .sl-handle.active {
            display: flex;
        }

        @keyframes sl-pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 83, 80, .5), 0 2px 8px rgba(239, 83, 80, .5);
            }

            70% {
                box-shadow: 0 0 0 6px rgba(239, 83, 80, 0), 0 2px 8px rgba(239, 83, 80, .5);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(239, 83, 80, 0), 0 2px 8px rgba(239, 83, 80, .5);
            }
        }

        .sl-handle.active {
            animation: sl-pulse 2s infinite;
        }

        .sl-handle:active {
            animation: none;
        }

        .sl-handle .sl-icon {
            flex-shrink: 0;
            opacity: .9;
        }

        .sl-handle .sl-label {
            color: rgba(255, 255, 255, .75);
            font-weight: 500;
        }

        .sl-handle .sl-price {
            font-family: 'Roboto Mono', monospace, sans-serif;
            font-weight: 700;
            color: #fff;
            font-size: 12px;
        }

        /* ── 内嵌订单面板 ── */
        .order-panel {
            display: none;
            position: absolute;
            top: 35px;
            left: 8px;
            width: 190px;
            background: rgba(19, 23, 34, .97);
            border: 1px solid #2a2e39;
            border-radius: 10px;
            padding: 12px 14px;
            z-index: 60;
            color: #d1d4dc;
        }

        .order-panel.active {
            display: block;
        }

        .op-hdr {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .op-hdr-title {
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }

        .op-x {
            background: none;
            border: none;
            color: #787b86;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
        }

        .op-dir-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .op-dir-badge.buy {
            background: rgba(38, 166, 154, .18);
            color: #26a69a;
            border: 1px solid #26a69a;
        }

        .op-dir-badge.sell {
            background: rgba(239, 83, 80, .18);
            color: #ef5350;
            border: 1px solid #ef5350;
        }

        .op-field {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .op-lbl {
            font-size: 10px;
            color: #787b86;
        }

        .op-calc {
            font-size: 11px;
            font-weight: 700;
            font-family: 'Roboto Mono', monospace, sans-serif;
        }

        .op-field input {
            width: 75px;
            background: #1e222d;
            border: 1px solid #2a2e39;
            border-radius: 4px;
            color: #d1d4dc;
            font-size: 11px;
            padding: 3px 6px;
            text-align: right;
        }

        .op-field input:focus {
            outline: none;
            border-color: #434651;
        }

        .op-divider {
            height: 1px;
            background: #2a2e39;
            margin: 5px 0;
        }

        .op-hint {
            font-size: 9px;
            color: #787b86;
            margin-top: 4px;
            text-align: center;
        }

        .op-footer {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .op-btn {
            flex: 1;
            padding: 5px 0;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        .op-btn.cancel {
            background: #2a2e39;
            color: #d1d4dc;
        }

        .op-btn.confirm {
            background: #26a69a;
            color: #fff;
        }

        .op-btn.confirm.sell {
            background: #ef5350;
        }

        .op-btn:hover {
            opacity: .85;
        }
    </style>
</head>

<body>

    <!-- 顶部导航 -->
    <div id="nav">
        <h1>📈 Trading Dashboard</h1>
        <div class="nav-links">
            <a href="/">单图模式</a>
            <a href="/multi.html" class="active">⊞ 四图总览</a>
            <!-- 语音提醒开关 -->
            <button id="voice-toggle" title="语音提醒" style="
              background:none;border:1px solid #2a2e39;border-radius:4px;
              color:#787b86;font-size:12px;padding:2px 8px;cursor:pointer;
              transition:all .2s;">🔔 语音</button>
        </div>
    </div>

    <!-- 2×2 网格（由 JS 动态生成） -->
    <div id="grid"></div>


    <script>
        // ─── 语音提醒模块（全局共享）────────────────────────────────
        let voiceEnabled = true;  // 默认开启，用户可手动关闭
        const voiceBtn = document.getElementById('voice-toggle');
        // 初始外观：默认 ON（绿色）
        voiceBtn.textContent = '🔔 语音 ON';
        voiceBtn.style.color = '#26a69a';
        voiceBtn.style.borderColor = '#26a69a';
        voiceBtn.addEventListener('click', () => {
            voiceEnabled = !voiceEnabled;
            voiceBtn.style.color = voiceEnabled ? '#26a69a' : '#787b86';
            voiceBtn.style.borderColor = voiceEnabled ? '#26a69a' : '#2a2e39';
            voiceBtn.textContent = voiceEnabled ? '🔔 语音 ON' : '🔔 语音';
        });
        const _spokenCache = new Map();
        function speak(text, priority = false) {
            if (!voiceEnabled) return;
            const now = Date.now();
            if (!priority && _spokenCache.has(text) && now - _spokenCache.get(text) < 5000) return;
            _spokenCache.set(text, now);
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'zh-CN'; u.rate = 1.1;
            speechSynthesis.speak(u);
        }

        // ── 默认四个标的 ──────────────────────────────────────────
        const DEFAULT_SYMBOLS = ['QQQ', 'AAPL', 'NVDA', 'TSLA'];
        const state = {};

        // 全局拖动状态（同一时刻只有一个面板在拖动）
        let activeDrag = null;

        // 全局订单标记刷新函数（setMarkers 需完整数组，必须升序）
        function refreshMarkers(sym) {
            const s = state[sym];
            s.candleSeries.setMarkers([...s.orderMarkers].sort((a, b) => a.time - b.time));
        }

        // 四图时间轴联动防递归忽
        let isSyncing = false;

        // ── 生成单元格 HTML ─────────────────────────────────────
        function createCell(symbol) {
            const id = symbol;
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.id = `cell-${id}`;
            cell.innerHTML = `
        <!-- 工具栏 -->
        <div class="c-toolbar">
          <!-- 左列 -->
          <div class="c-left">
            <div class="c-left-r1">
              <span class="c-symbol">${symbol}</span>
              <span class="c-price up" id="price-${id}">—</span>
              <span class="c-change up-bg up" id="change-${id}">—</span>
            </div>
            <div class="c-left-r2">
              <!-- 十字线 OHLC -->
              <div class="c-crosshair" id="ci-${id}">
                <span class="c-ci-time"  id="ci-time-${id}"></span>
                <span class="c-ci-item"><span class="c-ci-label">O</span><span class="c-ci-val" id="ci-o-${id}"></span></span>
                <span class="c-ci-item"><span class="c-ci-label">H</span><span class="c-ci-val" style="color:#26a69a" id="ci-h-${id}"></span></span>
                <span class="c-ci-item"><span class="c-ci-label">L</span><span class="c-ci-val" style="color:#ef5350" id="ci-l-${id}"></span></span>
                <span class="c-ci-item"><span class="c-ci-label">C</span><span class="c-ci-val" id="ci-c-${id}"></span></span>
              </div>
            </div>
          </div>
          <!-- 右列 -->
          <div class="c-right">
            <!-- 仓位面板 -->
            <div class="c-pos-panel" id="pos-panel-${id}">
              <div class="c-pos-row">
                <div class="c-pos-item"><label>开仓价</label><span id="p-entry-${id}">—</span></div>
                <div class="c-pos-item"><label>止损</label><span id="p-sl-${id}" style="color:#ef5350">—</span></div>
                <div class="c-pos-item"><label>数量</label><span id="p-qty-${id}">—</span></div>
                <div class="c-pos-item">
                  <label>盈亏</label>
                  <span id="p-pnl-${id}">—</span>
                  <span id="p-pnl-pct-${id}" style="font-size:10px;margin-left:3px">—</span>
                </div>
              </div>
            </div>
            <!-- 操作按钮 -->
            <div class="c-actions">
              <div class="c-toggle-wrap">
                <label class="c-toggle">
                  <input type="checkbox" id="st-toggle-${id}">
                  <span class="c-slider"></span>
                </label>
                <span id="st-label-${id}">ST止盈</span>
              </div>
              <div style="width:1px;height:18px;background:#2a2e39"></div>
              <button class="c-btn c-btn-open"  id="btn-open-${id}">开仓</button>
              <button class="c-btn c-btn-close" id="btn-close-${id}">平仓</button>
            </div>
          </div>
        </div>

        <!-- 图表区 -->
        <div class="c-chart-wrap" id="wrap-${id}">
          <div class="c-loading" id="loading-${id}">⏳ 加载中…</div>
          <div class="c-chart"  id="chart-${id}"></div>
          <!-- 图例 -->
          <div class="c-legend">
            <div class="c-legend-item"><div class="c-legend-dot" style="background:#26a69a"></div><span style="color:#26a69a">ST↑</span></div>
            <div class="c-legend-item"><div class="c-legend-dot" style="background:#ef5350"></div><span style="color:#ef5350">ST↓</span></div>
          </div>
          <!-- 止损药丸拖动控件 -->
          <div class="sl-handle" id="slh-${id}" title="上下拖动调整止损价">
            <svg class="sl-icon" width="10" height="13" viewBox="0 0 10 13" fill="none">
              <path d="M5 0L9 4H1L5 0Z" fill="white"/>
              <path d="M5 13L1 9H9L5 13Z" fill="white"/>
              <rect x="4" y="4" width="2" height="5" rx="1" fill="white" opacity=".5"/>
            </svg>
            <span class="sl-label">止损</span>
            <span class="sl-price">—</span>
          </div>
          <!-- 内嵌订单面板 -->
          <div class="order-panel" id="op-${id}">
            <div class="op-hdr">
              <span class="op-hdr-title" id="opt-${id}">开仓</span>
              <button class="op-x" id="opx-${id}">✕</button>
            </div>
            <div class="op-dir-badge buy" id="opd-${id}">▲ 做多</div>
            <div class="op-field">
              <span class="op-lbl">最大亏损</span>
              <input type="number" id="opm-${id}" value="100" min="1" step="1">
            </div>
            <div class="op-field">
              <span class="op-lbl">止损价</span>
              <span class="op-calc op-sl-val" style="color:#ef5350">—</span>
            </div>
            <div class="op-divider"></div>
            <div class="op-field"><span class="op-lbl">建议股数</span><span class="op-calc" id="opq-${id}">—</span></div>
            <div class="op-field"><span class="op-lbl">每股风险</span><span class="op-calc" id="opr-${id}" style="color:#ef5350">—</span></div>
            <div class="op-field"><span class="op-lbl">止损幅度</span><span class="op-calc" id="ops-${id}" style="color:#ef5350">—</span></div>
            <div class="op-field"><span class="op-lbl">开仓金额</span><span class="op-calc" id="opc-${id}">—</span></div>
            <div class="op-hint" id="oph-${id}"></div>
            <div class="op-footer">
              <button class="op-btn cancel" id="opcancel-${id}">取消</button>
              <button class="op-btn confirm" id="opconfirm-${id}">确认做多</button>
            </div>
          </div>
        </div>
      `;
            document.getElementById('grid').appendChild(cell);
        }

        // ── 初始化图表 ──────────────────────────────────────────
        function initChart(symbol) {
            const chartEl = document.getElementById(`chart-${symbol}`);
            const chart = LightweightCharts.createChart(chartEl, {
                layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
                grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                rightPriceScale: { borderColor: '#2a2e39' },
                timeScale: { borderColor: '#2a2e39', timeVisible: true, secondsVisible: false, fixLeftEdge: false },  // 允许视图向右拖过第一根 K 线
            });

            const candleSeries = chart.addCandlestickSeries({
                upColor: '#26a69a', downColor: '#ef5350',
                borderUpColor: '#26a69a', borderDownColor: '#ef5350',
                wickUpColor: '#26a69a', wickDownColor: '#ef5350',
            });

            // 自适应大小
            new ResizeObserver(() => {
                const r = chartEl.getBoundingClientRect();
                chart.applyOptions({ width: r.width, height: r.height });
            }).observe(chartEl);

            // 十字线 OHLC
            const ciBox = document.getElementById(`ci-${symbol}`);
            chart.subscribeCrosshairMove(param => {
                if (!param || !param.time || !param.seriesData?.size) {
                    ciBox.style.display = 'none'; return;
                }
                const bar = param.seriesData.get(candleSeries);
                if (!bar) { ciBox.style.display = 'none'; return; }
                const d = new Date(param.time * 1000);
                const hh = String(d.getUTCHours()).padStart(2, '0');
                const mm = String(d.getUTCMinutes()).padStart(2, '0');
                document.getElementById(`ci-time-${symbol}`).textContent = `${hh}:${mm}`;
                const fmt = v => v.toFixed(2);
                const bull = bar.close >= bar.open;
                const ciO = document.getElementById(`ci-o-${symbol}`);
                const ciC = document.getElementById(`ci-c-${symbol}`);
                ciO.textContent = fmt(bar.open);
                document.getElementById(`ci-h-${symbol}`).textContent = fmt(bar.high);
                document.getElementById(`ci-l-${symbol}`).textContent = fmt(bar.low);
                ciC.textContent = fmt(bar.close);
                ciO.style.color = ciC.style.color = bull ? '#26a69a' : '#ef5350';
                ciBox.style.display = 'flex';
            });

            state[symbol] = {
                symbol, chart, candleSeries,
                stSeriesList: [], stLastDir: null, stLastSeries: null,
                orderMarkers: [],  // 订单生命周期标记全量存储
            };
        }

        // ── SuperTrend 分段绘制 ─────────────────────────────────
        function createSegmentedST(symbol, bars) {
            const s = state[symbol];
            s.stSeriesList.forEach(ser => s.chart.removeSeries(ser));
            s.stSeriesList = []; s.stLastDir = null; s.stLastSeries = null;
            let currentDir = null, segData = [];

            function flush() {
                if (!segData.length) return;
                const color = currentDir === 1 ? '#26a69a' : '#ef5350';
                const ser = s.chart.addLineSeries({
                    color, lineWidth: 2,
                    crosshairMarkerVisible: false, lastValueVisible: false, priceLineVisible: false,
                });
                ser.setData(segData);
                s.stSeriesList.push(ser);
                s.stLastSeries = ser;
                s.stLastDir = currentDir;
            }

            for (const bar of bars) {
                if (bar.st_value == null || bar.st_dir == null) continue;
                if (bar.st_dir !== currentDir) { flush(); currentDir = bar.st_dir; segData = []; }
                segData.push({ time: bar.time, value: bar.st_value });
            }
            flush();
        }

        // ── 开盘区间 OR High/Low ────────────────────────────────
        function addOpeningRange(symbol, bars) {
            const { candleSeries } = state[symbol];
            const or = bars.slice(0, 15);
            if (!or.length) return;
            const orH = Math.max(...or.map(b => b.high));
            const orL = Math.min(...or.map(b => b.low));
            [{ price: orH, title: `OR High ${orH.toFixed(2)}` },
            { price: orL, title: `OR Low  ${orL.toFixed(2)}` }].forEach(({ price, title }) => {
                candleSeries.createPriceLine({
                    price, color: '#f59e0b', lineWidth: 1,
                    lineStyle: LightweightCharts.LineStyle.Dashed,
                    axisLabelVisible: true, title,
                });
            });
        }

        // ── 仓位展示（兼容真实 IBKR 数据格式和旧 Redis 格式）──────────────
        // 真实 IBKR 字段：avg_px_open / unrealized_pnl / side / quantity / stop_loss
        // 旧 Redis 字段： entry_price / pnl / pnl_pct / quantity / entry_time / stop_loss
        function addPositionLines(symbol, position) {
            if (!position) return;
            const { candleSeries } = state[symbol];

            const entryPrice = position.avg_px_open ?? position.entry_price;
            const stopLoss = position.stop_loss;
            const qty = position.quantity;
            const side = position.side || 'LONG';
            const isLong = side !== 'SHORT';
            const entryTime = position.entry_time;

            if (!entryPrice) return;

            // 保存仓位到 state，供行情变动时刷新浮盈
            state[symbol].position = position;

            // 开仓价线（蓝色虚线）
            candleSeries.createPriceLine({
                price: entryPrice, color: '#2196f3', lineWidth: 1,
                lineStyle: LightweightCharts.LineStyle.Dashed,
                axisLabelVisible: true,
                title: `开仓 ${typeof entryPrice === 'number' ? entryPrice.toFixed(2) : entryPrice}`,
            });

            // 止损价线（红色虚线，无止损时不画）
            if (stopLoss) {
                candleSeries.createPriceLine({
                    price: stopLoss, color: '#ef5350', lineWidth: 1,
                    lineStyle: LightweightCharts.LineStyle.Dashed,
                    axisLabelVisible: true, title: `止损 ${stopLoss}`,
                });
            }

            // 开仓 Marker（旧格式有 entryTime 时才画，实时格式通过 order:update FILLED 事件添加）
            if (entryTime) {
                state[symbol].orderMarkers.push({
                    time: entryTime,
                    position: isLong ? 'belowBar' : 'aboveBar',
                    color: '#2196f3',
                    shape: isLong ? 'arrowUp' : 'arrowDown',
                    text: `${isLong ? 'BUY' : 'SELL'} @${entryPrice}`, size: 1,
                });
                refreshMarkers(symbol);
            }

            refreshPositionPanel(symbol, position);
            document.getElementById(`pos-panel-${symbol}`).style.display = 'block';
        }

        function refreshPositionPanel(symbol, position) {
            if (!position) return;
            const entryPrice = position.avg_px_open ?? position.entry_price;
            const qty = position.quantity;
            const side = position.side || 'LONG';
            const isLong = side !== 'SHORT';

            let pnl = position.unrealized_pnl ?? position.pnl;
            let pnlPct = position.pnl_pct;

            // 真实数据实时重算浮盈%
            if (position.unrealized_pnl != null && entryPrice && qty > 0) {
                pnlPct = parseFloat((position.unrealized_pnl / (entryPrice * qty) * 100).toFixed(2));
            }

            const pnlEl = document.getElementById(`p-pnl-${symbol}`);
            const pnlPctEl = document.getElementById(`p-pnl-pct-${symbol}`);
            const fmt = v => typeof v === 'number' ? v.toFixed(2) : v;

            document.getElementById(`p-entry-${symbol}`).textContent = entryPrice ? fmt(entryPrice) : '—';
            document.getElementById(`p-sl-${symbol}`).textContent = position.stop_loss ?? '—';
            document.getElementById(`p-qty-${symbol}`).textContent = `${qty ?? '—'}股(${isLong ? '多' : '空'})`;

            if (pnl != null) {
                pnlEl.textContent = `${pnl >= 0 ? '+' : ''}${fmt(pnl)}`;
                pnlEl.className = pnl >= 0 ? 'up' : 'down';
            } else { pnlEl.textContent = '—'; pnlEl.className = ''; }

            if (pnlPct != null) {
                pnlPctEl.textContent = `(${pnlPct >= 0 ? '+' : ''}${fmt(pnlPct)}%)`;
                pnlPctEl.className = pnlPct >= 0 ? 'up' : 'down';
            } else { pnlPctEl.textContent = ''; }
        }

        function clearPositionUI(symbol) {
            state[symbol].position = null;
            document.getElementById(`pos-panel-${symbol}`).style.display = 'none';
            document.getElementById(`p-entry-${symbol}`).textContent = '—';
            document.getElementById(`p-sl-${symbol}`).textContent = '—';
            document.getElementById(`p-qty-${symbol}`).textContent = '—';
            document.getElementById(`p-pnl-${symbol}`).textContent = '—';
            document.getElementById(`p-pnl-pct-${symbol}`).textContent = '';
        }


        // ── 工具栏价格更新 ──────────────────────────────────────
        function updateHeader(symbol, bars) {
            if (!bars || bars.length < 2) return;
            const last = bars[bars.length - 1];
            const change = last.close - bars[0].open;
            const pct = (change / bars[0].open * 100).toFixed(2);
            const priceEl = document.getElementById(`price-${symbol}`);
            const changeEl = document.getElementById(`change-${symbol}`);
            priceEl.textContent = last.close.toFixed(2);
            changeEl.textContent = `${change >= 0 ? '+' : ''}${change.toFixed(2)} (${pct}%)`;
            const c = change >= 0 ? 'up' : 'down';
            priceEl.className = `c-price ${c}`;
            changeEl.className = `c-change ${c} ${c}-bg`;
        }

        // ── 加载单个标的数据 ────────────────────────────────────
        async function loadSymbol(symbol) {
            try {
                const res = await fetch(`/api/data/${symbol}`);
                if (!res.ok) throw new Error((await res.json()).error);
                const { m1_bars, position } = await res.json();

                document.getElementById(`loading-${symbol}`).style.display = 'none';

                // K 线
                state[symbol].candleSeries.setData(m1_bars.map(b => ({
                    time: b.time, open: b.open, high: b.high, low: b.low, close: b.close,
                })));

                createSegmentedST(symbol, m1_bars);
                addOpeningRange(symbol, m1_bars);
                addPositionLines(symbol, position);
                updateHeader(symbol, m1_bars);

                state[symbol].chart.timeScale().scrollToRealTime();
                // 用官方 API 扩展可见逻辑范围左侧，让首根 K 线前留出 8 根棒的空白
                const visRange = state[symbol].chart.timeScale().getVisibleLogicalRange();
                if (visRange !== null) {
                    state[symbol].chart.timeScale().setVisibleLogicalRange({
                        from: visRange.from - 8,
                        to: visRange.to,
                    });
                }

                // ── 构建止损拖动 ctx ──
                const s = state[symbol];
                const lastBar = m1_bars[m1_bars.length - 1];
                const lastST = [...m1_bars].reverse().find(b => b.st_value != null && b.st_value !== 0);
                const id = symbol;
                const ctx = {
                    sym: symbol, cs: s.candleSeries, chart: s.chart,
                    wrapEl: document.getElementById(`wrap-${id}`),
                    chartEl: document.getElementById(`chart-${id}`),
                    handleEl: document.getElementById(`slh-${id}`),
                    panelEl: document.getElementById(`op-${id}`),
                    latestClose: lastBar.close,
                    latestST: lastST ? lastST.st_value : null,
                    latestSTDir: lastST ? lastST.st_dir : null,
                    slPrice: null, slPriceLine: null, orderDir: 'BUY', orderMode: false,
                    // 订单面板子元素
                    dirBadgeEl: document.getElementById(`opd-${id}`),
                    panelTitleEl: document.getElementById(`opt-${id}`),
                    qtyEl: document.getElementById(`opq-${id}`),
                    riskEl: document.getElementById(`opr-${id}`),
                    slPctEl: document.getElementById(`ops-${id}`),
                    costEl: document.getElementById(`opc-${id}`),
                    hintEl: document.getElementById(`oph-${id}`),
                    maxLossEl: document.getElementById(`opm-${id}`),
                    confirmBtn: document.getElementById(`opconfirm-${id}`),
                };
                s.ctx = ctx;

                // 止损控件 mousedown → 开始拖动
                ctx.handleEl.addEventListener('mousedown', e => {
                    if (!ctx.orderMode) return;
                    activeDrag = ctx;
                    document.body.style.cursor = 'ns-resize';
                    e.preventDefault();
                });

                // 最大亏损输入 → 重算
                document.getElementById(`opm-${id}`).addEventListener('input', () => updateOrderPanel(ctx));

                // 取消 / ✕ 关闭
                document.getElementById(`opcancel-${id}`).addEventListener('click', () => exitOrderMode(ctx));
                document.getElementById(`opx-${id}`).addEventListener('click', () => exitOrderMode(ctx));

                // 确认开仓 —— 实际调用引擎 API
                document.getElementById(`opconfirm-${id}`).addEventListener('click', async () => {
                    const sl = ctx.slPrice;
                    const entry = ctx.latestClose || 0;
                    const maxLoss = parseFloat(ctx.maxLossEl.value) || 100;
                    const riskPerShare = Math.abs(entry - sl);

                    const acct = ctx.accountInfo || {};
                    const available = acct.available_cash || 0;
                    const total = acct.total_equity || 0;
                    const cashCap = available > 0 ? Math.min(available * 0.9, total) : Infinity;
                    const qtyByLoss = riskPerShare > 0 ? Math.floor(maxLoss / riskPerShare) : 0;
                    const qtyByCash = cashCap < Infinity && entry > 0 ? Math.floor(cashCap / entry) : Infinity;
                    const qty = Math.min(qtyByLoss, qtyByCash);

                    if (!sl || qty <= 0) { alert('止损价无效或每股风险过小'); return; }

                    const confirmed = confirm(
                        `确认开仓？\n方向: ${ctx.orderDir === 'BUY' ? '▲ 做多' : '▼ 做空'}\n` +
                        `标的: ${symbol}  数量: ${qty} 股\n` +
                        `开仓: 市价 (~$${entry.toFixed(2)})  止损: $${sl.toFixed(2)}\n` +
                        `预计资金: $${(qty * entry).toFixed(0)}`
                    );
                    if (!confirmed) return;

                    speak(`${symbol} 订单已下发，${ctx.orderDir === 'BUY' ? '做多' : '做空'} ${qty}股，止损 ${sl.toFixed(2)}`);

                    try {
                        const resp = await fetch(`/api/order/${symbol}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ side: ctx.orderDir, qty, stop_loss: sl, order_type: 'BRACKET' }),
                        });
                        const result = await resp.json();
                        if (result.engine_offline || result.error) {
                            speak(`订单失败，${result.error || '引擎未连接'}`, true);
                            alert(`⚠ 引擎未连接或出错: ${result.error || '请启动引擎'}`);
                        } else {
                            speak(`${symbol} 订单已受理`, true);
                            alert(`✅ 开仓请求已发送到引擎\n${symbol} ${ctx.orderDir === 'BUY' ? '做多' : '做空'} x${qty}\n止损: $${sl.toFixed(2)}`);
                        }
                    } catch (e) {
                        speak('网络错误，订单失败', true);
                        alert(`网络错误: ${e.message}`);
                    }
                    exitOrderMode(ctx);
                });


                // 图表缩放/滚动后重置控件位置
                s.chart.timeScale().subscribeVisibleLogicalRangeChange(() => {
                    if (ctx.orderMode) snapHandle(ctx);
                });

            } catch (e) {
                const el = document.getElementById(`loading-${symbol}`);
                if (el) el.textContent = `❌ ${e.message}`;
            }
        }


        // ── 事件绑定 ─────────────────────────────────────────────
        function bindEvents(symbol) {
            const s = state[symbol];

            // 开仓按钮 → 进入止损拖动模式
            document.getElementById(`btn-open-${symbol}`).addEventListener('click', () => {
                if (!s.ctx) return;
                enterOrderMode(s.ctx);
            });

            // 平仓
            document.getElementById(`btn-close-${symbol}`).addEventListener('click', async () => {
                if (!confirm(`确认平仓 ${symbol}？\n\n引擎将自动取消止损单并提交反向市价单。`)) return;
                const btn = document.getElementById(`btn-close-${symbol}`);
                btn.disabled = true;
                btn.textContent = '平仓中…';
                try {
                    const resp = await fetch(`/api/position/${symbol}`, { method: 'DELETE' });
                    const result = await resp.json();
                    if (result.warning) {
                        speak(`${symbol} 平仓警告，请在 TWS 检查仓位`, true);
                        alert(`⚠️ ${result.warning}`);
                        location.reload();
                    } else if (result.engine?.error) {
                        speak(`${symbol} 平仓失败`, true);
                        alert(`❌ 平仓失败: ${result.engine.error}`);
                    } else {
                        speak(`${symbol} 平仓指令已发出`, true);
                        // 不刷新页面，等 WebSocket position:update 事件自动清空 UI
                    }
                } catch (e) {
                    alert(`网络错误: ${e.message}`);
                } finally {
                    btn.disabled = false;
                    btn.textContent = '平仓';
                }
            });


            // ST 跟踪止盈
            document.getElementById(`st-toggle-${symbol}`).addEventListener('change', async e => {
                const on = e.target.checked;
                await fetch(`/api/settings/${symbol}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ st_trail: on }),
                });
                const lbl = document.getElementById(`st-label-${symbol}`);
                lbl.style.color = on ? '#26a69a' : '#787b86';
            });
        }

        // ── 全局拖动事件（绑在 document 层）──────────────────────
        document.addEventListener('mousemove', e => {
            if (!activeDrag) return;
            const { wrapEl, chartEl, handleEl } = activeDrag;
            const wRect = wrapEl.getBoundingClientRect();
            const eRect = chartEl.getBoundingClientRect();
            const containerY = e.clientY - wRect.top;
            const chartY = e.clientY - eRect.top;
            const price = activeDrag.cs.coordinateToPrice(chartY);
            if (price === null) return;
            handleEl.style.top = containerY + 'px';
            activeDrag.slPrice = parseFloat(price.toFixed(2));
            updateHandlePriceLabel(activeDrag);
            updateOrderPanel(activeDrag);
        });

        document.addEventListener('mouseup', () => {
            if (!activeDrag) return;
            snapHandle(activeDrag);
            document.body.style.cursor = '';
            activeDrag = null;
        });

        // 止损控件精确对齐（priceToCoordinate + offset）
        function snapHandle(ctx) {
            const y = ctx.cs.priceToCoordinate(ctx.slPrice);
            if (y === null) return;
            const offset = ctx.chartEl.getBoundingClientRect().top - ctx.wrapEl.getBoundingClientRect().top;
            ctx.handleEl.style.top = (y + offset) + 'px';
        }

        // 更新药丸价格标签
        function updateHandlePriceLabel(ctx) {
            ctx.handleEl.querySelector('.sl-price').textContent = ctx.slPrice.toFixed(2);
            const el = ctx.panelEl.querySelector('.op-sl-val');
            if (el) el.textContent = ctx.slPrice.toFixed(2);
        }

        // 核心：自动判方向 + 算股数（双上限） + 更新面板
        function updateOrderPanel(ctx) {
            const entry = ctx.latestClose || 0;
            if (!ctx.slPrice || !entry) return;
            const { slPrice } = ctx;

            const isBuy = slPrice < entry;
            ctx.orderDir = isBuy ? 'BUY' : 'SELL';
            ctx.dirBadgeEl.className = `op-dir-badge ${isBuy ? 'buy' : 'sell'}`;
            ctx.dirBadgeEl.textContent = isBuy ? '▲ 做多' : '▼ 做空';
            ctx.panelTitleEl.textContent = isBuy ? '做多开仓' : '做空开仓';
            ctx.confirmBtn.className = `op-btn confirm ${isBuy ? '' : 'sell'}`;
            ctx.confirmBtn.textContent = isBuy ? '确认做多' : '确认做空';

            const riskPerShare = Math.abs(entry - slPrice);
            const slPct = entry > 0 ? (riskPerShare / entry * 100) : 0;
            ctx.riskEl.textContent = riskPerShare > 0 ? `$${riskPerShare.toFixed(2)}` : '—';
            ctx.slPctEl.textContent = slPct > 0 ? `${slPct.toFixed(2)}%` : '—';

            // ── 股数：最大亏损 + 资金上限 取较小値 ──
            const maxLoss = parseFloat(ctx.maxLossEl.value) || 100;
            const acct = ctx.accountInfo || {};
            const available = acct.available_cash || 0;
            const total = acct.total_equity || 0;
            const cashCap = available > 0 ? Math.min(available * 0.9, total) : Infinity;
            const qtyByLoss = riskPerShare > 0 ? Math.floor(maxLoss / riskPerShare) : 0;
            const qtyByCash = cashCap < Infinity && entry > 0 ? Math.floor(cashCap / entry) : Infinity;
            const qty = Math.min(qtyByLoss, qtyByCash);
            ctx.qtyEl.textContent = qty > 0 ? `${qty} 股` : '—';
            ctx.qtyEl.style.color = qty > 0 ? '#d1d4dc' : '#787b86';
            ctx.qtyEl.title = (qty > 0 && qtyByCash < qtyByLoss)
                ? `按止损可开 ${qtyByLoss} 股，因资金上限抽到 ${qty} 股` : '';

            const cost = qty * entry;
            ctx.costEl.textContent = qty > 0 ? `$${cost.toFixed(0)}` : '—';
            if (qty > 0 && total > 0) {
                ctx.hintEl.textContent = `💡 占用 $${cost.toFixed(0)}（账户$${(total / 10000).toFixed(1)}万的 ${(cost / total * 100).toFixed(1)}%）`;
            } else if (qty > 0) {
                ctx.hintEl.textContent = `💡 占用 $${cost.toFixed(0)}（引擎未连接，资金校验已跳过）`;
            } else {
                ctx.hintEl.textContent = '请拖动止损控件';
            }
            if (ctx.slPriceLine) {
                ctx.slPriceLine.applyOptions({ price: slPrice, title: `止损 ${slPrice.toFixed(2)}` });
            }
        }

        // 进入开仓模式（异步获取真实账户余额）
        async function enterOrderMode(ctx) {
            try {
                const resp = await fetch('/api/account');
                const data = await resp.json();
                ctx.accountInfo = { ...data, engine_online: !data.engine_offline };
            } catch (e) {
                ctx.accountInfo = { total_equity: 0, available_cash: 0, engine_online: false };
            }

            const initSL = ctx.latestST
                ? ctx.latestST
                : (ctx.latestClose ? ctx.latestClose * 0.99 : 0);
            ctx.slPrice = parseFloat(initSL.toFixed(2));
            ctx.slPriceLine = ctx.cs.createPriceLine({
                price: ctx.slPrice, color: '#ef5350', lineWidth: 1,
                lineStyle: LightweightCharts.LineStyle.Dashed,
                axisLabelVisible: true, title: `止损 ${ctx.slPrice.toFixed(2)}`,
            });
            ctx.orderMode = true;
            ctx.handleEl.classList.add('active');
            ctx.panelEl.classList.add('active');
            updateHandlePriceLabel(ctx);
            updateOrderPanel(ctx);
            snapHandle(ctx);
        }

        // 退出开仓模式
        function exitOrderMode(ctx) {
            ctx.orderMode = false;
            if (ctx.slPriceLine) { ctx.cs.removePriceLine(ctx.slPriceLine); ctx.slPriceLine = null; }
            ctx.handleEl.classList.remove('active');
            ctx.panelEl.classList.remove('active');
            activeDrag = null;
            document.body.style.cursor = '';
        }


        // ── WebSocket 实时更新 ──────────────────────────────────
        function connectWS() {
            const ws = new WebSocket('ws://localhost:3000');
            ws.onmessage = ({ data }) => {
                try {
                    const { channel, data: payload } = JSON.parse(data);

                    // ── 真实 IBKR 仓位推送（无 :symbol 后缀，提前处理）──
                    if (channel === 'position:update') {
                        const posSym = payload.symbol;
                        if (posSym && state[posSym]) {
                            if (payload.closed) {
                                // 平仓标记（橙色圆点）
                                const ct = state[posSym].lastTickTime;
                                if (ct) {
                                    const wasLong = state[posSym].position
                                        ? state[posSym].position.side !== 'SHORT' : true;
                                    state[posSym].orderMarkers.push({
                                        time: ct,
                                        position: wasLong ? 'aboveBar' : 'belowBar',
                                        color: '#ff9800',
                                        shape: 'circle',
                                        text: '平仓',
                                        size: 0.8,
                                    });
                                    refreshMarkers(posSym);
                                }
                                clearPositionUI(posSym);
                                speak(`${posSym} 仓位已平仓`, true);
                            } else {
                                const isNew = !state[posSym].position;
                                addPositionLines(posSym, payload);
                                if (isNew) speak(`${posSym} ${payload.side === 'SHORT' ? '做空' : '做多'}开仓成功`, true);
                            }
                        }
                        return;
                    }

                    // ── 引擎订单状态回执（order_actor.py 通过 Redis 发布）──
                    if (channel === 'order:update') {
                        const o = payload;
                        const sym = o.symbol || '未知';
                        const side = o.side === 'BUY' ? '做多' : '做空';
                        const id = (o.client_order_id || '').slice(-6);
                        switch (o.status) {
                            case 'ACCEPTED':
                                speak(`${sym} 订单已接受`, true);
                                showToast(`✅ ${sym} 订单已接受 #${id}`, 'ok');
                                break;
                            case 'FILLED': {
                                speak(`${sym} ${side}订单成交，成交价 ${o.last_px}`, true);
                                showToast(`✅ ${sym} ${side}成交 @${o.last_px} x${o.last_qty}`, 'ok');
                                // 成交标记（蓝色/红色箭头）
                                const fillSym = sym;
                                if (state[fillSym]) {
                                    const ft = state[fillSym].lastTickTime;
                                    if (ft) {
                                        const isBuy = o.side === 'BUY';
                                        state[fillSym].orderMarkers.push({
                                            time: ft,
                                            position: isBuy ? 'belowBar' : 'aboveBar',
                                            color: isBuy ? '#2196f3' : '#ef5350',
                                            shape: isBuy ? 'arrowUp' : 'arrowDown',
                                            text: `${isBuy ? '开多' : '开空'} @${o.last_px}`,
                                            size: 1,
                                        });
                                        refreshMarkers(fillSym);
                                    }
                                }
                                break;
                            }
                            case 'PARTIALLY_FILLED':
                                speak(`${sym} 订单部分成交`, true);
                                showToast(`🔶 ${sym} 部分成交 @${o.last_px} x${o.last_qty}`, 'tip');
                                break;
                            case 'REJECTED':
                                speak(`${sym} 订单被拒绝，${o.reason || ''}`, true);
                                showToast(`❌ ${sym} 订单拒绝: ${o.reason || ''}`, 'warn');
                                break;
                            case 'DENIED':
                                speak(`${sym} 订单被风控拒绝，${o.reason || ''}`, true);
                                showToast(`❌ ${sym} 风控拒绝: ${o.reason || ''}`, 'warn');
                                break;
                            case 'TRIGGERED': {
                                speak(`${sym} 止损单已触发，注意`, true);
                                showToast(`🔔 ${sym} 止损单触发`, 'tip');
                                // 止损触发标记（黄色圆点）
                                const trigSym = sym;
                                if (state[trigSym]) {
                                    const tt = state[trigSym].lastTickTime;
                                    if (tt) {
                                        state[trigSym].orderMarkers.push({
                                            time: tt,
                                            position: 'aboveBar',
                                            color: '#f59e0b',
                                            shape: 'circle',
                                            text: '止损触发',
                                            size: 0.8,
                                        });
                                        refreshMarkers(trigSym);
                                    }
                                }
                                break;
                            }
                            case 'CANCELED':
                                showToast(`⛔ ${sym} 订单已取消 #${id}`, 'info');
                                break;
                            case 'EXPIRED':
                                speak(`${sym} 订单已过期`, true);
                                showToast(`⌛ ${sym} 订单过期 #${id}`, 'tip');
                                break;
                            default:
                                showToast(`📎 ${sym} 订单状态: ${o.status}`, 'info');
                        }
                        return;
                    }

                    // ── 第一步：从 channel 末段提取 symbol ────────────────
                    const sym = DEFAULT_SYMBOLS.find(s => channel.endsWith(`:${s}`));
                    if (!sym || !state[sym]) return;

                    // ── 第二步：payload.symbol 二次校验（防止数据串台）─────
                    if (payload.symbol && payload.symbol !== sym) {
                        console.error(`[WS串台拦截] channel=${channel} 对应 ${sym}，但 payload.symbol=${payload.symbol}，已丢弃`);
                        return;
                    }


                    const s = state[sym];

                    // tick 实时推送：记录最新 tick 时间
                    if (channel.startsWith('bars:1m:tick:')) {
                        s.lastTickTime = payload.time;
                        s.candleSeries.update({
                            time: payload.time, open: payload.open,
                            high: payload.high, low: payload.low, close: payload.close,
                        });
                        return;
                    }
                    // kline:1m: 收盘——竞态防护：tick 已推进下一分钟则跳过 candleSeries.update
                    if (channel.startsWith('kline:1m:')) {
                        if (payload.time >= (s.lastTickTime || 0)) {
                            s.candleSeries.update({
                                time: payload.time, open: payload.open,
                                high: payload.high, low: payload.low, close: payload.close,
                            });
                        }
                        // 行情变动：更新 latestClose，刷新仓位浮盈面板
                        if (s.ctx) s.ctx.latestClose = payload.close;
                        const priceEl = document.getElementById(`price-${sym}`);
                        if (priceEl) priceEl.textContent = payload.close.toFixed(2);
                        if (s.position) {
                            const pos = s.position;
                            const ep = pos.avg_px_open ?? pos.entry_price;
                            if (ep) {
                                pos.unrealized_pnl =
                                    (payload.close - ep) * pos.quantity *
                                    (pos.side === 'SHORT' ? -1 : 1);
                                refreshPositionPanel(sym, pos);
                            }
                        }
                        if (payload.st_value != null && payload.st_value !== 0) {
                            // ST 转向语音提醒
                            if (s.stLastDir !== null && payload.st_dir !== s.stLastDir) {
                                speak(`${sym} 超级趋势转${payload.st_dir === 1 ? '向上' : '向下'}，注意转向`, true);
                            }
                            if (payload.st_dir !== s.stLastDir || !s.stLastSeries) {
                                const color = payload.st_dir === 1 ? '#26a69a' : '#ef5350';
                                s.stLastSeries = s.chart.addLineSeries({
                                    color, lineWidth: 2,
                                    crosshairMarkerVisible: false, lastValueVisible: false, priceLineVisible: false,
                                });
                                s.stSeriesList.push(s.stLastSeries);
                                s.stLastDir = payload.st_dir;
                            }
                            s.stLastSeries.update({ time: payload.time, value: payload.st_value });
                        }
                        return;
                    }




                } catch (err) {
                    console.error('[WS处理错误]', err.message, err);
                }
            };
            ws.onclose = () => setTimeout(connectWS, 3000);
        }

        // ── 启动 ────────────────────────────────────────────────
        DEFAULT_SYMBOLS.forEach(sym => {
            createCell(sym);
            initChart(sym);
            bindEvents(sym);
        });
        Promise.all(DEFAULT_SYMBOLS.map(sym => loadSymbol(sym))).then(() => {
            // ── 四图时间轴联动（拖动/缩放任一图，其余三图同步）──────────
            DEFAULT_SYMBOLS.forEach(sym => {
                state[sym].chart.timeScale().subscribeVisibleTimeRangeChange(range => {
                    if (isSyncing || !range) return;
                    isSyncing = true;
                    DEFAULT_SYMBOLS.forEach(other => {
                        if (other !== sym) {
                            try { state[other].chart.timeScale().setVisibleRange(range); } catch (_) { }
                        }
                    });
                    isSyncing = false;
                });

                // ── 十字线联动（悬停任一图，其余三图同步显示十字线）──────
                state[sym].chart.subscribeCrosshairMove(param => {
                    if (!param || !param.time) return;
                    DEFAULT_SYMBOLS.forEach(other => {
                        if (other !== sym) {
                            try {
                                state[other].chart.setCrosshairPosition(
                                    param.seriesData.get(state[sym].candleSeries)?.close ?? 0,
                                    param.time,
                                    state[other].candleSeries
                                );
                            } catch (_) { }
                        }
                    });
                });
            });
        });
        connectWS();

    </script>
</body>

</html>

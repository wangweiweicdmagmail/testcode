<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四宫格主控台</title>
    <link rel="stylesheet" href="/shared/status-bar.css">
    <link rel="stylesheet" href="/shared/toast.css">
    <link rel="stylesheet" href="/shared/approval-ui.css">
    <script
        src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #131722;
            color: #d1d4dc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ── 2×2 网格 ── */
        #grid {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 1px;
            background: #2a2e39;
            overflow: hidden;
        }

        /* ── 单元格 ── */
        .cell {
            background: #131722;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transition: box-shadow .2s, outline-color .2s;
        }

        .cell.cell-alpha-pending {
            outline: 2px solid rgba(239, 83, 80, .55);
            outline-offset: -2px;
            box-shadow: inset 0 0 0 1px rgba(239, 83, 80, .25);
        }

        /* 待审批聚焦：脉冲 + 其他格淡化 */
        #grid.grid-approval-mode .cell:not(.cell-approval-focus) {
            opacity: 0.42;
            filter: saturate(0.65);
            transition: opacity .35s, filter .35s;
        }

        .cell.cell-approval-focus {
            outline: 3px solid #ef5350;
            outline-offset: -3px;
            box-shadow: 0 0 0 1px rgba(239, 83, 80, .4), 0 0 28px rgba(239, 83, 80, .35);
            z-index: 2;
            animation: approval-pulse 1.6s ease-in-out infinite;
        }

        @keyframes approval-pulse {
            0%, 100% { box-shadow: 0 0 0 1px rgba(239, 83, 80, .35), 0 0 18px rgba(239, 83, 80, .25); }
            50% { box-shadow: 0 0 0 2px rgba(239, 83, 80, .65), 0 0 32px rgba(239, 83, 80, .45); }
        }

        .alpha-approval-ribbon {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 10px;
            background: linear-gradient(90deg, rgba(239, 83, 80, .28), rgba(239, 83, 80, .08));
            border-bottom: 1px solid rgba(239, 83, 80, .45);
            font-size: 11px;
            color: #ffcdd2;
            flex-shrink: 0;
        }

        .alpha-approval-ribbon.hidden { display: none; }

        .alpha-approval-ribbon .ribbon-tag {
            background: #ef5350;
            color: #fff;
            font-weight: 700;
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 3px;
            letter-spacing: .5px;
        }

        .alpha-approval-ribbon .ribbon-body { color: #ffe0e0; flex: 1; }

        .alpha-approval-ribbon .ribbon-hint {
            color: #ef9a9a;
            font-size: 10px;
            white-space: nowrap;
        }

        .alpha-actions.alpha-actions-highlight {
            padding: 6px;
            margin: -2px -4px 4px;
            border-radius: 4px;
            background: rgba(239, 83, 80, .12);
            border: 1px solid rgba(239, 83, 80, .35);
        }

        .c-btn-alpha.approve-live {
            animation: approve-btn-glow 1.4s ease-in-out infinite;
        }

        @keyframes approve-btn-glow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 83, 80, .4); }
            50% { box-shadow: 0 0 10px 2px rgba(239, 83, 80, .55); }
        }

        .cell.cell-alpha-wait {
            outline: 2px solid rgba(41, 98, 255, .55);
            outline-offset: -2px;
        }

        .cell.cell-alpha-ready {
            outline: 2px solid rgba(38, 166, 154, .45);
            outline-offset: -2px;
        }

        .cell.cell-alpha-executing {
            outline: 2px solid rgba(240, 185, 11, .65);
            outline-offset: -2px;
            box-shadow: inset 0 0 0 1px rgba(240, 185, 11, .25);
            animation: exec-pulse 1.2s ease-in-out infinite;
        }

        @keyframes exec-pulse {
            0%, 100% { box-shadow: inset 0 0 0 1px rgba(240, 185, 11, .2); }
            50% { box-shadow: inset 0 0 12px rgba(240, 185, 11, .35); }
        }

        .astep.active-executing { color: #f0b90b; font-weight: 700; }

        .cell.cell-has-position {
            box-shadow: inset 3px 0 0 #2196f3;
        }

        .cell.cell-flash {
            animation: cell-flash .8s ease;
        }

        @keyframes cell-flash {
            0%, 100% { filter: none; }
            50% { filter: brightness(1.15); }
        }

        /* ── 单元格：左图 + 右侧三块 ── */
        .c-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 3px 8px;
            background: #1e222d;
            border-bottom: 1px solid #2a2e39;
            flex-shrink: 0;
            min-height: 28px;
        }

        .c-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .c-header a.c-detail-link {
            font-size: 10px;
            color: #787b86;
            text-decoration: none;
            padding: 1px 6px;
            border: 1px solid #2a2e39;
            border-radius: 3px;
        }

        .c-header a.c-detail-link:hover { color: #2962ff; border-color: #2962ff; }

        .alpha-pill {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 3px;
            font-weight: 600;
        }

        .pill-pending { background: rgba(239,83,80,.2); color: #ef5350; }
        .pill-wait { background: rgba(41,98,255,.2); color: #2962ff; }
        .pill-ready { background: rgba(38,166,154,.2); color: #26a69a; }
        .pill-executing { background: rgba(240,185,11,.22); color: #f0b90b; }
        .pill-none { background: #2a2e39; color: #787b86; }

        .c-body {
            flex: 1;
            display: flex;
            min-height: 0;
            overflow: hidden;
        }

        .c-sidebar {
            width: 204px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 6px 7px;
            background: #1a1e2a;
            border-left: 1px solid #2a2e39;
            overflow-y: auto;
            font-size: 12px;
        }

        .c-panel {
            background: #131722;
            border: 1px solid #2a2e39;
            border-radius: 4px;
            padding: 6px 7px;
        }

        .c-panel-title {
            font-size: 11px;
            font-weight: 700;
            color: #787b86;
            text-transform: uppercase;
            letter-spacing: .04em;
            margin-bottom: 5px;
        }

        .alpha-steps {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .alpha-steps.compact {
            flex-direction: row;
            flex-wrap: wrap;
            gap: 2px 5px;
        }

        .alpha-steps.compact .astep {
            font-size: 10px;
            padding: 0;
        }

        .astep {
            font-size: 11px;
            color: #4b5563;
            padding: 1px 0;
        }

        .astep.done { color: #787b86; }
        .astep.active { color: #2962ff; font-weight: 700; }
        .astep.active-pending { color: #ef5350; font-weight: 700; }

        .alpha-detail {
            font-size: 11px;
            color: #787b86;
            margin-top: 4px;
            line-height: 1.5;
            word-break: break-word;
            white-space: normal;
        }

        .alpha-detail .sig-ok { color: #26a69a; }
        .alpha-detail .sig-warn { color: #f0b90b; }
        .alpha-detail .sig-muted { color: #4b5563; }
        .alpha-detail b.up { color: #26a69a; }
        .alpha-detail b.down { color: #ef5350; }

        .pos-signal-hint {
            margin-top: 4px;
            font-size: 10px;
            color: #787b86;
            line-height: 1.4;
        }

        .pos-signal-hint b.up { color: #26a69a; }
        .pos-signal-hint b.down { color: #ef5350; }

        .alpha-actions {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 5px;
        }

        .c-btn-alpha {
            border: none;
            border-radius: 3px;
            padding: 5px 0;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .c-btn-alpha.approve-live { background: #ef5350; color: #fff; }
        .c-btn-alpha.reject { background: #2a2e39; color: #d1d4dc; border: 1px solid #434651; }
        .c-btn-alpha.cancel { background: #434651; color: #d1d4dc; }

        .pos-sidebar .ps-row {
            display: flex;
            justify-content: space-between;
            gap: 6px;
            line-height: 1.55;
        }

        .pos-sidebar .ps-row label { color: #787b86; }
        .pos-sidebar .ps-row span { font-weight: 600; text-align: right; }

        .pos-empty { color: #4b5563; font-size: 11px; }

        .sys-panel .sys-row {
            line-height: 1.55;
            color: #787b86;
        }

        .sys-panel .sys-row b { color: #d1d4dc; font-weight: 600; }
        .sys-panel .sys-row b.warn { color: #f0b90b; }

        .c-actions-mini {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: auto;
            padding-top: 3px;
        }

        .c-actions-mini .c-btn {
            width: 100%;
            padding: 6px 0;
        }

        .c-actions-mini .c-toggle-wrap {
            justify-content: center;
            font-size: 11px;
        }

        .c-actions-mini select {
            width: 100%;
            font-size: 11px;
            padding: 4px 6px;
        }

        /* ── 单元格头部（legacy toolbar 部分保留给 crosshair） ── */
        .c-toolbar {
            display: none;
        }

        .c-left-r2-inline {
            display: flex;
            align-items: center;
            min-height: 14px;
            margin-left: 4px;
        }

        /* ── 图表区 ── */
        .c-chart-wrap {
            flex: 1;
            position: relative;
            overflow: hidden;
            min-width: 0;
        }

        /* 隐藏旧右列 */
        .c-right { display: none !important; }

        .c-symbol {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
        }

        .c-symbol-sel {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 0 2px;
            border-radius: 3px;
        }
        .c-symbol-sel:hover { background: #2a2e39; }
        .c-symbol-sel option { background: #1e222d; color: #fff; font-weight: 600; }

        .c-price { font-size: 13px; font-weight: 600; }
        .c-change { font-size: 10px; padding: 1px 5px; border-radius: 3px; }

        .c-crosshair {
            display: none;
            align-items: center;
            font-size: 9px;
            font-family: 'Roboto Mono', monospace, sans-serif;
        }

        .c-ci-item { display: flex; align-items: center; margin-right: 6px; }
        .c-ci-label { color: #787b86; margin-right: 2px; font-size: 9px; }
        .c-ci-val { font-weight: 600; font-size: 9px; color: #d1d4dc; }
        .c-ci-time { color: #4b5563; font-size: 9px; margin-right: 6px; }

        .c-pos-panel { display: none !important; }

        .c-toggle-wrap {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: #787b86;
        }

        .c-toggle {
            position: relative;
            display: inline-block;
            width: 26px;
            height: 14px;
        }

        .c-toggle input { opacity: 0; width: 0; height: 0; }

        .c-slider {
            position: absolute;
            inset: 0;
            background: #2a2e39;
            border-radius: 14px;
            cursor: pointer;
        }

        .c-slider:before {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            left: 2px;
            top: 2px;
            background: #d1d4dc;
            border-radius: 50%;
            transition: transform .2s;
        }

        .c-toggle input:checked + .c-slider { background: #26a69a; }
        .c-toggle input:checked + .c-slider:before { transform: translateX(12px); }

        .c-btn {
            padding: 6px 10px;
            border-radius: 4px;
            border: none;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .c-btn-open { background: #26a69a; color: #fff; }
        .c-btn-close { background: #ef5350; color: #fff; }
        .c-btn-close:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .c-chart {
            width: 100%;
            height: 100%;
        }

        /* 图例 */
        .c-legend {
            position: absolute;
            top: 6px;
            left: 8px;
            display: flex;
            gap: 10px;
            font-size: 10px;
            pointer-events: none;
            z-index: 10;
        }

        .c-legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .c-legend-dot {
            width: 8px;
            height: 2px;
            border-radius: 1px;
        }
        .c-legend-dot-thick {
            width: 12px;
            height: 5px;
        }

        /* 加载遮罩 */
        .c-loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #131722;
            font-size: 13px;
            color: #787b86;
            z-index: 100;
        }

        /* 颜色工具类 */
        .up {
            color: #26a69a;
        }

        .down {
            color: #ef5350;
        }

        .up-bg {
            background: rgba(38, 166, 154, .15);
        }

        .down-bg {
            background: rgba(239, 83, 80, .15);
        }

        /* ── 止损药丸拖动控件 ── */
        .sl-handle {
            display: none;
            position: absolute;
            right: 58px;
            transform: translateY(-50%);
            align-items: center;
            gap: 5px;
            background: #ef5350;
            border-radius: 16px;
            padding: 4px 10px 4px 8px;
            cursor: ns-resize;
            z-index: 50;
            user-select: none;
            box-shadow: 0 2px 8px rgba(239, 83, 80, .5);
            white-space: nowrap;
            font-size: 11px;
        }

        .sl-handle.active {
            display: flex;
        }

        @keyframes sl-pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 83, 80, .5), 0 2px 8px rgba(239, 83, 80, .5);
            }

            70% {
                box-shadow: 0 0 0 6px rgba(239, 83, 80, 0), 0 2px 8px rgba(239, 83, 80, .5);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(239, 83, 80, 0), 0 2px 8px rgba(239, 83, 80, .5);
            }
        }

        .sl-handle.active {
            animation: sl-pulse 2s infinite;
        }

        .sl-handle:active {
            animation: none;

        /* 持仓期间止损修改模式：橙色常亮 */
        .sl-handle.modify {
            display: flex;
            background: #ff9800;
            box-shadow: 0 2px 8px rgba(255, 152, 0, .5);

        }

        .sl-handle.modify:hover {

        }

        .sl-handle .sl-icon {
            flex-shrink: 0;

        }

        .sl-handle .sl-label {
            color: rgba(255, 255, 255, .75);

        }

        .sl-handle .sl-price {
            font-family: 'Roboto Mono', monospace, sans-serif;
            font-weight: 700;
            color: #fff;
            font-size: 12px;
        }

        /* ── 内嵌订单面板 ── */
        .order-panel {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;

            border-radius: 12px;
            padding: 16px 18px;

        /* 遮罩层：点击对话框外部时关闭 */

            inset: 0;
            background: rgba(0, 0, 0, .45);
            z-index: 9998;

        .order-panel-overlay.active {

        }

        .op-hdr {

        .op-hdr-title {

        }

<body>

    <!-- 开仓对话框遮罩层（点击关闭） -->
    <div class="order-panel-overlay" id="orderPanelOverlay"></div>

    <div id="status-bar-root"></div>

    <!-- 2×2 网格（由 JS 动态生成） -->
    <div id="grid"></div>

    <script src="/shared/api-auth.js"></script>
    <script src="/shared/alpha-copy.js"></script>
    <script src="/shared/approval-modal.js"></script>
    <script src="/shared/toast.js"></script>
    <script src="/shared/status-bar.js"></script>
    <script src="/shared/alpha-workflow.js"></script>
    <script src="/shared/alpha-cell.js"></script>
    <script>
        // ─── 语音提醒（由 Status Bar 铃铛控制）────────────────────
        const _spokenCache = new Map();
        function speak(text, priority = false) {
            if (window.StatusBar && !StatusBar.isVoiceEnabled()) return;
            const now = Date.now();
            if (!priority && _spokenCache.has(text) && now - _spokenCache.get(text) < 5000) return;
            _spokenCache.set(text, now);
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'zh-CN'; u.rate = 1.1;
            speechSynthesis.speak(u);
        }

        StatusBar.mount('status-bar-root', 'multi');

        // ── 可选标的池（与后端 server.js ALL_SYMBOLS 一致）──────────────
        const SYMBOL_UNIVERSE = ['NVDA', 'AAPL', 'GOOG', 'AVGO', 'SPY', 'TSLA', 'PLTR', 'AMZN', 'AMD', 'META', 'MSFT', 'QQQ', 'TSM', 'MU', 'NFLX'];
        const FALLBACK_SYMBOLS = ['NVDA', 'TSLA', 'AAPL', 'QQQ'];
        let ALPHA_SCAN_SYMBOLS = ['NVDA', 'TSLA', 'AAPL'];

        fetch('/api/config/public').then(r => r.json()).then(cfg => {
            if (cfg.alpha_symbols?.length) {
                ALPHA_SCAN_SYMBOLS = cfg.alpha_symbols;
                window.__ALPHA_SCAN_SYMBOLS = cfg.alpha_symbols;
            }
        }).catch(() => {});

        function isAlphaScanSymbol(sym) {
            return (window.__ALPHA_SCAN_SYMBOLS || ALPHA_SCAN_SYMBOLS).includes(sym);
        }

        // 选股优先级：URL ?symbols=A,B,C,D → localStorage → 默认
        function resolveSymbols() {
            const url = new URLSearchParams(location.search).get('symbols');
            let list = url
                ? url.split(',')
                : JSON.parse(localStorage.getItem('multiSymbols') || 'null');
            list = (list || FALLBACK_SYMBOLS)
                .map(s => String(s).trim().toUpperCase())
                .filter(s => SYMBOL_UNIVERSE.includes(s));
            list = [...new Set(list)].slice(0, 4);
            for (const d of [...FALLBACK_SYMBOLS, ...SYMBOL_UNIVERSE]) {
                if (list.length >= 4) break;
                if (!list.includes(d)) list.push(d);
            }
            return list;
        }

        // 换某个格子的股票：写入 localStorage 并重载
        function loadSlotMeta() {
            try { return JSON.parse(localStorage.getItem('multiSlotMeta') || '{}'); }
            catch (_) { return {}; }
        }
        function saveSlotMeta(meta) {
            localStorage.setItem('multiSlotMeta', JSON.stringify(meta));
        }

        /** 格子保护分：越高越不宜替换；Infinity = 不可替换 */
        function getSlotProtectionScore(sym, slotIdx) {
            if (!sym) return -1;
            const pos = state[sym]?.position;
            if (pos && Math.abs(pos.quantity || 0) > 0) return Infinity;

            if (window.AlphaCell) {
                const { phase } = AlphaCell.phaseForSymbol(sym);
                if (phase === 'pending' || phase === 'wait' || phase === 'ready') return Infinity;
            }
            if (state[sym]?.autoMode === 'live') return Infinity;

            const meta = loadSlotMeta();
            const slot = meta[slotIdx];
            const ageMin = slot?.shownAt ? (Date.now() - slot.shownAt) / 60000 : 999;

            let score = 0;
            if (state[sym]?.autoMode === 'observe') score += 800;
            if (slot?.source === 'manual') score += Math.max(0, 450 - ageMin * 3);
            else if (slot?.source === 'proposal') score += Math.max(0, 380 - ageMin * 4);
            else if (slot?.source === 'signal') score += Math.max(0, 280 - ageMin * 5);
            score -= Math.min(180, ageMin * 0.8);
            return score;
        }

        function pickReplacementSlot(newSym) {
            // 第一轮：有限保护分最低的格子（observe/旧信号/手动）—— 优先挤
            let bestIdx = -1;
            let bestScore = Infinity;
            for (let i = 0; i < DEFAULT_SYMBOLS.length; i++) {
                const sym = DEFAULT_SYMBOLS[i];
                if (sym === newSym) return i;
                const score = getSlotProtectionScore(sym, i);
                if (!Number.isFinite(score)) continue;
                if (score < bestScore) {
                    bestScore = score;
                    bestIdx = i;
                }
            }
            if (bestIdx >= 0) return bestIdx;

            // 第二轮（全 Infinity：pending/live）：强制挤掉非持仓中 shownAt 最早的
            const meta = loadSlotMeta();
            let fallbackIdx = -1;
            let earliest = Infinity;
            for (let i = 0; i < DEFAULT_SYMBOLS.length; i++) {
                const sym = DEFAULT_SYMBOLS[i];
                if (sym === newSym) return i;
                const pos = state[sym]?.position;
                if (pos && Math.abs(pos.quantity || 0) > 0) continue;   // 持仓 = 风控底线，永不挤
                const shownAt = meta[i]?.shownAt || 0;
                if (shownAt < earliest) {
                    earliest = shownAt;
                    fallbackIdx = i;
                }
            }
            return fallbackIdx;   // 全持仓则 -1（真不可挤，由调用方提示）
        }

        function autoAssignSymbolToGrid(sym, source, extra = {}) {
            sym = String(sym).toUpperCase();
            if (!SYMBOL_UNIVERSE.includes(sym)) return false;
            if (DEFAULT_SYMBOLS.includes(sym)) {
                if (window.AlphaWorkflow) {
                    AlphaWorkflow.setApprovalFocus(sym, extra.proposal || null);
                } else {
                    focusCell(sym);
                }
                return true;
            }
            autoAssignSymbolToGridQueued(sym, source, extra);
            return true;
        }

        function autoAssignSymbolToGridQueued(sym, source, extra = {}) {
            sym = String(sym).toUpperCase();
            if (!SYMBOL_UNIVERSE.includes(sym)) return Promise.resolve(false);
            if (DEFAULT_SYMBOLS.includes(sym)) {
                if (window.AlphaWorkflow) {
                    AlphaWorkflow.setApprovalFocus(sym, extra.proposal || null);
                } else {
                    focusCell(sym);
                }
                return Promise.resolve(true);
            }
            return enqueueGridMutation(`assign ${sym}`, async () => {
                if (DEFAULT_SYMBOLS.includes(sym)) {
                    focusApprovalCell(sym, extra.proposal || null);
                    return true;
                }
                const slotIdx = pickReplacementSlot(sym);
                if (slotIdx < 0) {
                    speak(`${sym} 无法显示，四宫格已满`, true);
                    showToast(`⚠️ 四宫格保护中，无法显示 ${sym}`, 'warn');
                    return false;
                }
                const oldSym = DEFAULT_SYMBOLS[slotIdx];
                const meta = loadSlotMeta();
                meta[slotIdx] = { sym, shownAt: Date.now(), source, replaced: oldSym };
                saveSlotMeta(meta);
                DEFAULT_SYMBOLS[slotIdx] = sym;
                localStorage.setItem('multiSymbols', JSON.stringify([...DEFAULT_SYMBOLS]));
                syncGridSymbolGlobals();

                await remountSlotAtIndex(slotIdx, sym);

                if (window.AlphaWorkflow) {
                    AlphaWorkflow.playAfterReload(sym, {
                        signal: extra.signal || null,
                        proposal: extra.proposal || null,
                    });
                    setTimeout(() => focusApprovalCell(sym, extra.proposal || null), 300);
                } else {
                    speak(`${sym} 新建议待审批`, true);
                    showToast(`📋 ${sym} 新建议待审批`, 'tip');
                }
                showToast(`↪ ${oldSym} → ${sym}（${source === 'proposal' ? '待审批' : '新信号'}）`, 'tip');
                focusCell(sym);
                return true;
            });
        }

        const _knownPendingIds = new Set();
        const _lastSignalAnnounce = {};

        function focusApprovalCell(sym, proposal) {
            if (window.AlphaWorkflow) {
                AlphaWorkflow.setApprovalFocus(sym, proposal);
            } else {
                focusCell(sym);
            }
        }
        window.focusApprovalCell = focusApprovalCell;

        function onNewProposalDetected(p) {
            const sym = String(p.symbol || '').toUpperCase();
            if (!sym) return;
            if (!DEFAULT_SYMBOLS.includes(sym)) {
                if (window.AlphaWorkflow) {
                    AlphaWorkflow.handleProposal(p, { deferGrid: true });
                }
                autoAssignSymbolToGrid(sym, 'proposal', { proposal: p });
                return;
            }
            if (window.AlphaWorkflow) {
                AlphaWorkflow.handleProposal(p);
            } else {
                speak(`${sym} 新建议待审批`, true);
                showToast(`📋 ${sym} 新建议待审批`, 'tip');
                focusCell(sym);
            }
        }

        function playPostReloadAlert() {
            if (window.AlphaWorkflow) {
                const stash = AlphaWorkflow.readStash();
                if (stash?.sym && DEFAULT_SYMBOLS.includes(stash.sym)) {
                    AlphaWorkflow.playAfterReload(stash.sym, {
                        signal: stash.signal,
                        proposal: stash.proposal,
                    });
                    setTimeout(() => focusApprovalCell(stash.sym, stash.proposal), 600);
                    return;
                }
            }
            const raw = sessionStorage.getItem('multiPendingAlert');
            if (!raw) return;
            sessionStorage.removeItem('multiPendingAlert');
            try {
                const a = JSON.parse(raw);
                if (Date.now() - (a.ts || 0) > 120000) return;
                if (a.sym && DEFAULT_SYMBOLS.includes(a.sym)) {
                    setTimeout(() => focusApprovalCell(a.sym, null), 300);
                }
            } catch (_) { /* ignore */ }
        }

        function initSlotMetaFromGrid() {
            const meta = loadSlotMeta();
            const now = Date.now();
            DEFAULT_SYMBOLS.forEach((sym, idx) => {
                if (!meta[idx] || meta[idx].sym !== sym) {
                    meta[idx] = { sym, shownAt: now, source: meta[idx]?.source || 'manual' };
                }
            });
            saveSlotMeta(meta);
        }

        function syncGridSymbolGlobals() {
            window.__ALPHA_SYMBOLS = Object.fromEntries(DEFAULT_SYMBOLS.map(s => [s, true]));
            window.__ALPHA_SYMBOL_LIST = DEFAULT_SYMBOLS;
        }

        function slotCellId(slotIdx) {
            return `cell-slot-${slotIdx}`;
        }

        function findCellForSymbol(sym) {
            sym = String(sym || '').toUpperCase();
            if (!sym) return null;
            return document.querySelector(`.cell[data-symbol="${sym}"]`);
        }
        window.findAlphaCell = findCellForSymbol;

        /** 串行化换格，避免多信号并发 remount 互相 destroy 错格 */
        let _gridMutationChain = Promise.resolve();
        function enqueueGridMutation(label, fn) {
            const run = _gridMutationChain.then(() => fn());
            _gridMutationChain = run.catch((e) => {
                console.error(`[grid] ${label} failed:`, e);
                showToast(`换格失败: ${e.message || e}`, 'warn');
            });
            return run;
        }

        function destroyCellAtSlot(slotIdx) {
            const grid = document.getElementById('grid');
            const cell = grid?.children[slotIdx];
            if (!cell) return;
            const sym = (cell.dataset.symbol || '').toUpperCase();
            if (sym && state[sym]?.chart) {
                try { state[sym].chart.remove(); } catch (_) { /* ignore */ }
            }
            if (sym) delete state[sym];
            cell.remove();
        }

        function destroyCell(symbol) {
            const sym = String(symbol || '').toUpperCase();
            const idx = DEFAULT_SYMBOLS.indexOf(sym);
            if (idx >= 0) destroyCellAtSlot(idx);
            else document.getElementById(`cell-${sym}`)?.remove();
        }

        /** 将 K 线视图居中到最近一段行情（刷新/换标后调用） */
        function centerChartView(symbol) {
            const s = state[symbol];
            if (!s?.chart) return;
            const n = s.m5Bars?.length || 0;
            if (n < 2) {
                try { s.chart.timeScale().fitContent(); } catch (_) { /* ignore */ }
                return;
            }
            const win = Math.min(52, n);
            const pad = Math.max(8, Math.floor(win * 0.14));
            const to = (n - 1) + pad;
            const from = Math.max(0, to - win - pad);
            try {
                s.chart.timeScale().setVisibleLogicalRange({ from, to });
            } catch (_) {
                try { s.chart.timeScale().fitContent(); } catch (_2) { /* ignore */ }
            }
        }

        function wireCrosshairForSymbol(sym) {
            const s = state[sym];
            if (!s?.chart) return;
            s.chart.subscribeCrosshairMove(param => {
                if (!param || !param.time) return;
                DEFAULT_SYMBOLS.forEach(other => {
                    if (other === sym || !state[other]?.chart) return;
                    try {
                        state[other].chart.setCrosshairPosition(
                            param.seriesData.get(s.candleSeries)?.close ?? 0,
                            param.time,
                            state[other].candleSeries,
                        );
                    } catch (_) { /* ignore */ }
                });
            });
        }

        async function remountSlotAtIndex(slotIdx, symbol) {
            symbol = String(symbol).toUpperCase();
            destroyCellAtSlot(slotIdx);

            const cell = createCell(symbol, slotIdx);
            cell.id = slotCellId(slotIdx);
            cell.dataset.symbol = symbol;
            const grid = document.getElementById('grid');
            if (slotIdx >= grid.children.length) {
                grid.appendChild(cell);
            } else {
                grid.insertBefore(cell, grid.children[slotIdx]);
            }

            initChart(symbol);
            bindEvents(symbol);
            updateSysPanel(symbol);
            await loadSymbol(symbol);
            drawProposalPriceLines(symbol);
            wireCrosshairForSymbol(symbol);
            if (window.AlphaCell) {
                try {
                    await AlphaCell.refresh([symbol], StatusBar.getSnapshot?.() || {});
                } catch (_) { /* ignore */ }
            }
            updateAlphaPill(symbol);
        }

        async function changeSlotSymbol(idx, newSym) {
            newSym = String(newSym).toUpperCase();
            if (!SYMBOL_UNIVERSE.includes(newSym)) return;
            const oldSym = DEFAULT_SYMBOLS[idx];
            if (oldSym === newSym) return;

            const dup = DEFAULT_SYMBOLS.indexOf(newSym);
            const swapIdx = (dup !== -1 && dup !== idx) ? dup : -1;

            await enqueueGridMutation(`change ${oldSym}→${newSym}`, async () => {
                DEFAULT_SYMBOLS[idx] = newSym;
                if (swapIdx >= 0) DEFAULT_SYMBOLS[swapIdx] = oldSym;

                const meta = loadSlotMeta();
                meta[idx] = { sym: newSym, shownAt: Date.now(), source: 'manual' };
                if (swapIdx >= 0) {
                    meta[swapIdx] = { sym: oldSym, shownAt: Date.now(), source: meta[swapIdx]?.source || 'manual' };
                }
                saveSlotMeta(meta);
                localStorage.setItem('multiSymbols', JSON.stringify([...DEFAULT_SYMBOLS]));
                syncGridSymbolGlobals();

                await remountSlotAtIndex(idx, newSym);
                if (swapIdx >= 0) await remountSlotAtIndex(swapIdx, oldSym);

                focusCell(newSym);
                showToast(swapIdx >= 0 ? `已互换 ${oldSym} ↔ ${newSym}` : `已切换 ${oldSym} → ${newSym}`, 'tip');
            });
        }
        window.changeSlotSymbol = changeSlotSymbol;

        // ── 四个标的（可由用户选择）──────────────────────────────────
        const DEFAULT_SYMBOLS = resolveSymbols();
        syncGridSymbolGlobals();
        const state = {};

        async function syncAlphaFromSnapshot(snapshot) {
            if (window.AlphaCell) await AlphaCell.refresh(DEFAULT_SYMBOLS, snapshot);
            syncPositionsFromSnapshot(snapshot);
            (snapshot?.pending || []).forEach((p) => {
                const pid = p.proposal_id;
                if (!pid || _knownPendingIds.has(pid)) return;
                _knownPendingIds.add(pid);
                onNewProposalDetected(p);
            });
            DEFAULT_SYMBOLS.forEach((sym) => {
                updateAlphaPill(sym);
                drawProposalPriceLines(sym);
                updateAlphaSidePanels(sym);
            });
        }

        function focusCell(sym) {
            const cell = findCellForSymbol(sym);
            if (!cell) return;
            cell.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            cell.classList.add('cell-flash');
            setTimeout(() => cell.classList.remove('cell-flash'), 800);
        }

        function syncPositionsFromSnapshot(snapshot) {
            const posMap = snapshot?.positionsBySymbol || {};
            DEFAULT_SYMBOLS.forEach((sym) => applyPositionSync(sym, posMap[sym] || null));
        }

        function applyPositionSync(sym, incoming) {
            const had = !!(state[sym]?.position && Math.abs(state[sym].position.quantity || 0) > 0);
            const has = incoming && Math.abs(incoming.quantity || 0) > 0;
            const cell = findCellForSymbol(sym);
            if (cell) cell.classList.toggle('cell-has-position', !!has);

            if (!has) {
                if (had) clearPositionUI(sym);
                else refreshPosSidebar(sym, null);
                updateCloseButton(sym, false);
                return;
            }

            const merged = { ...incoming };
            const live = state[sym]?.ctx?.latestClose;
            const ep = merged.avg_px_open ?? merged.entry_price;
            if (live && ep && merged.unrealized_pnl == null) {
                merged.unrealized_pnl = (live - ep) * merged.quantity * (merged.side === 'SHORT' ? -1 : 1);
            } else if (state[sym]?.position?.unrealized_pnl != null) {
                merged.unrealized_pnl = state[sym].position.unrealized_pnl;
            }
            if (merged.stop_loss == null && state[sym]?.position?.stop_loss != null) {
                merged.stop_loss = state[sym].position.stop_loss;
            }

            if (!had && state[sym]?.candleSeries) {
                addPositionLines(sym, merged);
            } else {
                state[sym].position = merged;
                refreshPosSidebar(sym, merged);
                updateCloseButton(sym, true);
                if (merged.stop_loss && state[sym]?.slPriceLine) {
                    state[sym].slPriceLine.applyOptions({
                        price: merged.stop_loss,
                        title: `止损 ${merged.stop_loss}`,
                    });
                }
            }
        }

        // StatusBar.refresh() 会在末尾触发轮询回调 syncAlphaFromSnapshot，
        // 因此这里只需调用 refresh，避免重复渲染。
        async function refreshAlphaPanels() {
            await StatusBar.refresh();
        }
        window.refreshAlphaPanels = refreshAlphaPanels;

        window.onAlphaUpdated = () => {
            DEFAULT_SYMBOLS.forEach((sym) => {
                updateAlphaPill(sym);
                drawProposalPriceLines(sym);
            });
        };

        window.addEventListener('nautilus:focus-alpha', (e) => {
            const phase = e.detail?.phase || 'pending';
            const sym = window.AlphaCell?.firstSymbolForPhase(phase);
            if (!sym) {
                const msg = phase === 'pending' ? '暂无待审批标的'
                  : (phase === 'active' || phase === 'ready' || phase === 'wait')
                    ? '暂无待执行/等待回踩标的' : '暂无标的';
                showToast(msg, 'tip');
                return;
            }
            const { phase: cellPhase, proposal } = AlphaCell.phaseForSymbol(sym);
            focusApprovalCell(sym, cellPhase === 'pending' ? proposal : null);
            if (cellPhase !== 'pending') focusCell(sym);
        });

        window.addEventListener('nautilus:focus-pending', (e) => {
            const sym = String(e.detail?.symbol || '').toUpperCase();
            if (!sym) return;
            if (!DEFAULT_SYMBOLS.includes(sym)) {
                showToast(`${sym} 不在当前四宫格，请从历史页审批或等待换格`, 'warn');
                return;
            }
            const proposal = window.AlphaCell?.phaseForSymbol(sym)?.proposal;
            focusApprovalCell(sym, proposal);
        });

        window.addEventListener('nautilus:focus-position', () => {
            const sym = DEFAULT_SYMBOLS.find((s) => {
                const q = state[s]?.position?.quantity;
                return q != null && Math.abs(q) > 0;
            });
            if (!sym) {
                showToast('暂无持仓', 'tip');
                return;
            }
            focusCell(sym);
        });

        function updateAlphaPill(symbol) {
            const el = document.getElementById(`alpha-pill-${symbol}`);
            if (!el) return;
            // 有 Alpha 提案时优先显示审批状态（待审批/等待回踩/待执行）
            if (window.AlphaCell) {
                const { phase } = AlphaCell.phaseForSymbol(symbol);
                if (phase !== 'none') {
                    const p = AlphaCell.pillForSymbol(symbol);
                    el.className = `alpha-pill ${p.cls}`;
                    el.textContent = p.text;
                    el.style.background = '';
                    el.style.color = '';
                    return;
                }
            }
            // 无提案：显示最新超级信号方向
            const side = state[symbol]?.superSide ?? 0;
            el.className = 'alpha-pill';
            if (side === 1) { el.style.background = '#0d3b2e'; el.style.color = ST_COLOR_BULL; el.textContent = '▲超级多'; }
            else if (side === -1) { el.style.background = '#3b1d1d'; el.style.color = ST_COLOR_BEAR; el.textContent = '▼超级空'; }
            else { el.style.background = ''; el.style.color = ''; el.textContent = '无超级信号'; }
        }

        function stDirLabel(dir) {
            if (dir === 1) return '▲多';
            if (dir === -1) return '▼空';
            return '—';
        }

        function formatTouchClock(ts) {
            if (!ts) return '';
            const d = new Date(Number(ts) * 1000);
            if (Number.isNaN(d.getTime())) return '';
            const hh = String(d.getUTCHours()).padStart(2, '0');
            const mm = String(d.getUTCMinutes()).padStart(2, '0');
            return `${hh}:${mm}`;
        }

        function getGridSignalContext(symbol) {
            const s = state[symbol];
            if (!s) return { superSide: 0 };
            const superSide = s.superSide ?? 0;
            const st5 = s.m5Frozen?.st_dir;
            const st1 = s.m1Frozen?.st_dir;
            const st5Label = stDirLabel(st5).replace('▲', '').replace('▼', '');
            const st1Label = stDirLabel(st1).replace('▲', '').replace('▼', '');
            const want = superSide === 1 ? 1 : (superSide === -1 ? -1 : null);
            const stAligned = want != null && st5 === want && st1 === want;
            const touch = s.lastSuperTouch;
            return {
                superSide,
                sideLabel: superSide === 1 ? '▲ 超级多' : (superSide === -1 ? '▼ 超级空' : '无超级信号'),
                sideCls: superSide === 1 ? 'up' : (superSide === -1 ? 'down' : ''),
                st5, st1, st5Label, st1Label, stAligned,
                touchTime: touch ? formatTouchClock(touch.touch_time) : '',
                touchPrice: touch?.trigger_level ?? touch?.stop_price ?? null,
            };
        }
        window.getGridSignalContext = getGridSignalContext;

        function updateAlphaSidePanels(symbol) {
            updateSysPanel(symbol);
            if (!state[symbol]?.position) refreshPosSidebar(symbol, null);
            if (window.AlphaCell) AlphaCell.renderPanel(symbol);
        }

        function updateSysPanel(symbol) {
            const el = document.getElementById(`sys-${symbol}`);
            if (!el) return;
            const s = state[symbol];
            const ctx = getGridSignalContext(symbol);
            const stCls = d => d === 1 ? 'up' : (d === -1 ? 'down' : '');
            const agentMode = document.getElementById(`auto-sel-${symbol}`)?.value || 'off';
            const agentMap = { off: '关', observe: '观察', live: '实盘' };
            const agentCls = agentMode === 'live' ? 'down' : (agentMode === 'observe' ? 'warn' : '');
            const snap = window.StatusBar?.getSnapshot?.();
            const hb = document.getElementById('sb-engine');
            const engineTxt = (snap?.engineOk ?? hb?.classList.contains('ok')) ? '在线' : '离线';
            const alignTxt = ctx.superSide
                ? (ctx.stAligned ? '同向' : '分歧')
                : '—';
            const alignCls = ctx.superSide
                ? (ctx.stAligned ? 'up' : 'warn')
                : '';
            el.innerHTML = `
              <div class="sys-row">超级 <b class="${stCls(ctx.superSide)}">${stDirLabel(ctx.superSide)}</b></div>
              <div class="sys-row">ST 5m <b class="${stCls(ctx.st5)}">${stDirLabel(ctx.st5)}</b></div>
              <div class="sys-row">ST 1m <b class="${stCls(ctx.st1)}">${stDirLabel(ctx.st1)}</b></div>
              <div class="sys-row">对齐 <b class="${alignCls}">${alignTxt}</b></div>
              <div class="sys-row">Agent <b class="${agentCls}">${agentMap[agentMode] || agentMode}</b></div>
              <div class="sys-row">引擎 <b>${engineTxt}</b></div>`;
        }

        function updateCloseButton(symbol, enabled) {
            const btn = document.getElementById(`btn-close-${symbol}`);
            if (!btn) return;
            btn.disabled = !enabled;
            btn.title = enabled ? '平仓' : '无持仓';
        }

        function refreshPosSidebar(symbol, position) {
            const box = document.getElementById(`pos-sidebar-${symbol}`);
            if (!box) return;
            if (!position) {
                const ctx = getGridSignalContext(symbol);
                if (ctx.superSide) {
                    const hint = ctx.touchTime
                        ? `信号 ${ctx.touchTime}${ctx.touchPrice ? ` · 损 ${Number(ctx.touchPrice).toFixed(2)}` : ''}`
                        : '有超级信号 · 待扫描建建议';
                    box.innerHTML = `<div class="pos-empty">无持仓</div>
                      <div class="pos-signal-hint"><b class="${ctx.sideCls}">${ctx.sideLabel}</b><br>${hint}</div>`;
                } else {
                    box.innerHTML = '<div class="pos-empty">无持仓</div>';
                }
                return;
            }
            const entry = position.avg_px_open ?? position.entry_price;
            const qty = position.quantity;
            const side = position.side === 'SHORT' ? '空' : '多';
            let pnl = position.unrealized_pnl ?? position.pnl;
            const fmt = v => (typeof v === 'number' ? v.toFixed(2) : v);
            const pnlCls = pnl >= 0 ? 'up' : 'down';
            let pnlPct = null;
            if (typeof pnl === 'number' && entry && qty) {
                const cost = Math.abs(entry * qty);
                if (cost > 0) pnlPct = (pnl / cost * 100);
            }
            box.innerHTML = `
              <div class="ps-row"><label>方向</label><span>${side}</span></div>
              <div class="ps-row"><label>数量</label><span>${qty ?? '—'}</span></div>
              <div class="ps-row"><label>成本</label><span>${entry ? fmt(entry) : '—'}</span></div>
              <div class="ps-row"><label>止损</label><span style="color:#ef5350">${position.stop_loss ?? '—'}</span></div>
              <div class="ps-row"><label>盈亏</label><span class="${pnlCls}">${pnl != null ? (pnl >= 0 ? '+' : '') + fmt(pnl) : '—'}${pnlPct != null ? ` (${pnlPct >= 0 ? '+' : ''}${pnlPct.toFixed(2)}%)` : ''}</span></div>`;
        }

        // 全局拖动状态（同一时刻只有一个面板在拖动）
        let activeDrag = null;

        // 全局标记刷新（订单标记 + 超级信号标记，setMarkers 需完整数组升序）
        function refreshMarkers(sym) {
            const s = state[sym];
            if (!s?.candleSeries) return;
            const all = [...(s.orderMarkers || []), ...(s.signalMarkers || [])];
            s.candleSeries.setMarkers(all.sort((a, b) => a.time - b.time));
        }

        let chartsReady = false;

        // ── 初始化图表 ──────────────────────────────────────────
        function initChart(symbol) {

                layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },

                timeScale: { borderColor: '#2a2e39', timeVisible: true, secondsVisible: false, fixLeftEdge: false },  // 允许视图向右拖过第一根 K 线

            const candleSeries = chart.addCandlestickSeries({

            // 自适应大小
            new ResizeObserver(() => {

            }).observe(chartEl);

            // 十字线 OHLC
            const ciBox = document.getElementById(`ci-${symbol}`);
            chart.subscribeCrosshairMove(param => {
                if (!param || !param.time || !param.seriesData?.size) {

                }
                const bar = param.seriesData.get(candleSeries);
                if (!bar) { ciBox.style.display = 'none'; return; }
                const d = new Date(param.time * 1000);

                const mm = String(d.getUTCMinutes()).padStart(2, '0');

                const fmt = v => v.toFixed(2);

                const ciO = document.getElementById(`ci-o-${symbol}`);
                const ciC = document.getElementById(`ci-c-${symbol}`);

                document.getElementById(`ci-h-${symbol}`).textContent = fmt(bar.high);
                document.getElementById(`ci-l-${symbol}`).textContent = fmt(bar.low);
                ciC.textContent = fmt(bar.close);
                ciO.style.color = ciC.style.color = bull ? '#26a69a' : '#ef5350';
